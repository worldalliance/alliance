name: Publish Mobile OTA

# Publishes an over-the-air JS/asset update to the deploy environment's EAS
# Update channel: production for store installs, staging for the staging app.
# Only JS/asset changes ship this way; native changes still require a store
# build (the fingerprint runtimeVersion guards compatibility).
#
# Dispatch with a commit to ship an older commit to the store-live runtime after
# main has moved to a new fingerprint:
#   gh workflow run publish-mobile-ota.yaml -f ref=<full-sha>

on:
  workflow_call:
    inputs:
      environment:
        description: production or staging; names the EAS channel and the app variant
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Full SHA of a commit whose fingerprint matches the store-live baseline and whose API calls the production backend already serves
        required: true

jobs:
  publish-mobile-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'production' }}
    env:
      APP_VARIANT: ${{ inputs.environment || 'production' }}
    steps:
      # release/ is the commit that ships; on dispatch the root is main, for its
      # actions and live fingerprint baseline.
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: release

      - name: Require a deployed production commit dispatched from main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref must be a full commit SHA." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Dispatch from main, whose fingerprint baseline is live." >&2
            exit 1
          fi
          live=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yaml/runs?branch=production&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$REF...$live" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "$REF is not in the last successful production deploy, $live (compare status: $status)." >&2
            exit 1
          fi

      - uses: ./.github/actions/dirty-check
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          working-directory: release
          check: empty

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./release

      - name: Require store-live fingerprint
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cp common/src/mobileFingerprints.gen.ts release/common/src/mobileFingerprints.gen.ts
          (cd release/apps/mobile && bun run fingerprint:check)
          git -C release checkout -- common/src/mobileFingerprints.gen.ts

      # Staging builds are made by hand, so a native change on main strands the
      # installed staging apps until someone rebuilds.
      - name: Warn when no staging build runs this fingerprint
        if: ${{ env.APP_VARIANT == 'staging' }}
        working-directory: ./release/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # @expo/fingerprint hashes a config it failed to load instead of failing.
          bunx expo config --type public > /dev/null
          hashes=$(node scripts/fingerprint.mjs)
          for platform in ios android; do
            fingerprint=$(awk -v p="$platform:" '$1 == p { print $2 }' <<<"$hashes")
            builds=$(bunx eas-cli@16.5.0 build:list --platform "$platform" --build-profile staging \
              --runtime-version "$fingerprint" --status finished --limit 1 --json --non-interactive)
            if [ "$(jq length <<<"$builds")" = 0 ]; then
              echo "::warning title=Staging app needs a rebuild::No $platform staging build runs fingerprint $fingerprint, so installed staging apps won't get this update. Run \`eas build --profile staging --platform $platform --auto-submit\` from apps/mobile."
            fi
          done

      - name: Publish EAS Update
        run: bunx eas-cli@16.5.0 update --branch "$APP_VARIANT" --message "$(git log -1 --format=%B)" --non-interactive
        working-directory: ./release/apps/mobile
        env:
          # `eas update` ignores eas.json build profiles, so the job pins the
          # variant. It must resolve the same app config as the store build, or
          # the fingerprint runtimeVersion won't match any installed build and
          # the OTA never applies.
          EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
