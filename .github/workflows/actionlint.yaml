name: Actionlint

on:
  workflow_call:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      # actionlint opens a composite action's action.yml to check the inputs its
      # callers pass, and stops there, so the scripts they run need their own pass.
      # A library a `run:` block sources is outside its reach the same way.
      - name: Lint Shell Scripts
        run: shellcheck .github/actions/*/*.sh .github/scripts/*.sh scripts/deploy_backend.sh scripts/deploy_monitoring.sh scripts/disable_action_update_texts_emails.sh scripts/download_staging_data.sh scripts/secrets_run.sh scripts/sync_prod_to_staging.sh scripts/with_db_env.sh scripts/with-secrets.sh deploy/nginx/*.sh

      - name: Reject GitHub Secrets
        run: .github/scripts/reject-github-secrets.sh
