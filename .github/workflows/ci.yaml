name: CI

on:
  pull_request:
    branches: [main, production]

jobs:
  dirty-check:
    if: ${{ github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dirty-check
        with:
          check: exists

  actionlint:
    uses: ./.github/workflows/actionlint.yaml

  format-check:
    uses: ./.github/workflows/format-check.yaml

  gitignore-check:
    uses: ./.github/workflows/gitignore-check.yaml

  skills-path-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject skills outside agents/skills
        run: |
          if [ -e skills ]; then
            echo "::error::Skills live in agents/skills/, the directory .claude/skills and .agents/skills point at. Move skills/* there."
            exit 1
          fi

  typecheck:
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            server,
            common,
            kora-review,
            shared,
            sharedweb,
            apps/frontend,
            apps/admin,
            apps/mobile,
            citesting,
          ]
    uses: ./.github/workflows/typecheck.yaml
    with:
      package: ${{ matrix.package }}

  test-unit:
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            server,
            common,
            kora-review,
            shared,
            sharedweb,
            apps/frontend,
            apps/admin,
            apps/mobile,
            scripts,
            .github,
            citesting,
            agents/hooks,
            agents/skills,
          ]
    uses: ./.github/workflows/test-unit.yaml
    with:
      package: ${{ matrix.package }}

  test-backend-e2e:
    uses: ./.github/workflows/test-backend-e2e.yaml

  migrations-drift-check:
    uses: ./.github/workflows/migrations-drift-check.yaml

  mobile-bundle-check:
    uses: ./.github/workflows/mobile-bundle-check.yaml

  mobile-fingerprint-check:
    uses: ./.github/workflows/mobile-fingerprint-check.yaml
    permissions:
      contents: read
      id-token: write
