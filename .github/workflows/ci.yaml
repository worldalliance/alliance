name: CI

on:
  pull_request:
    branches: [main, production]

jobs:
  dirty-check:
    if: ${{ github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dirty-check
        with:
          check: exists

  actionlint:
    uses: ./.github/workflows/actionlint.yaml

  format-check:
    uses: ./.github/workflows/format-check.yaml

  gitignore-check:
    uses: ./.github/workflows/gitignore-check.yaml

  typecheck:
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            server,
            common,
            shared,
            sharedweb,
            apps/frontend,
            apps/admin,
            apps/mobile,
            citesting,
          ]
    uses: ./.github/workflows/typecheck.yaml
    with:
      package: ${{ matrix.package }}

  test-unit:
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            server,
            common,
            shared,
            sharedweb,
            apps/frontend,
            apps/admin,
            apps/mobile,
            scripts,
            .github,
          ]
    uses: ./.github/workflows/test-unit.yaml
    with:
      package: ${{ matrix.package }}

  test-backend-e2e:
    uses: ./.github/workflows/test-backend-e2e.yaml

  migrations-drift-check:
    uses: ./.github/workflows/migrations-drift-check.yaml

  mobile-fingerprint-check:
    uses: ./.github/workflows/mobile-fingerprint-check.yaml
    secrets:
      SLACK_WEBHOOK_URL_DEPLOYMENT: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOYMENT }}
