name: tzdb release watch

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Overlapping runs would each close the other's pull request as superseded, and
# a release whose pull request is closed never gets another.
concurrency: tzdb-release-watch

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Point the generator at the latest release
        id: bump
        working-directory: common
        run: |
          version=$(bun scripts/bump-tzdb.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip a release that already has a pull request
        id: branch
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="tzdb/${{ steps.bump.outputs.version }}"
          prs=$(gh pr list --head "$branch" --state all --json number --jq length)
          if [ "$prs" -gt 0 ]; then
            echo "$branch already has a pull request."
          else
            echo "name=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the catalog
        if: steps.branch.outputs.name != ''
        working-directory: common
        run: bun run generate-timezone-catalog

      # A pull request opened with GITHUB_TOKEN triggers no workflows, so CI
      # doesn't run on it until someone closes and reopens it.
      - name: Typecheck and test common
        if: steps.branch.outputs.name != ''
        run: |
          (cd common && bun run typecheck)
          scripts/test-all.sh common

      - name: Open a pull request
        if: steps.branch.outputs.name != ''
        uses: ./.github/actions/open-superseding-pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.name }}
          title: bump tzdb to ${{ steps.bump.outputs.version }}
          supersedes: tzdb/
          body: |
            IANA released tzdb ${{ steps.bump.outputs.version }}: https://data.iana.org/time-zones/tzdb-${{ steps.bump.outputs.version }}/NEWS

            Read the diff to `common/src/timezone-catalog.gen.ts`. A row that disappears or an alias that moves changes what members with that timezone see.

            Typecheck and tests for `common` passed in the job that opened this. CI hasn't run: close and reopen this pull request to start it.
