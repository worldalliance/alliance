name: tzdb release watch

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Overlapping runs would each close the other's pull request as superseded, and
# a release whose pull request is closed never gets another.
concurrency: tzdb-release-watch

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Point the generator at the latest release
        id: bump
        working-directory: common
        run: |
          version=$(bun scripts/bump-tzdb.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip a release that already has a pull request
        id: branch
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="tzdb/${{ steps.bump.outputs.version }}"
          prs=$(gh pr list --head "$branch" --state all --json number --jq length)
          if [ "$prs" -gt 0 ]; then
            echo "$branch already has a pull request."
          else
            echo "name=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the catalog
        if: steps.branch.outputs.name != ''
        working-directory: common
        run: bun run generate-timezone-catalog

      # The server computes local times from FormatJS's tzdb, not the catalog.
      - name: Update FormatJS
        id: formatjs
        if: steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/bump-formatjs.sh

      # A pull request opened with GITHUB_TOKEN triggers no workflows, so CI
      # doesn't run on it until someone closes and reopens it. The server's
      # timezone test fails on a zone this release adds until FormatJS ships it,
      # and the next run tries again.
      - name: Typecheck and test common, typecheck server, test server timezones
        if: steps.branch.outputs.name != ''
        run: |
          (cd common && bun run typecheck)
          scripts/test-all.sh common
          (cd server && bun run typecheck && bun test src/intl-timezone.spec.ts)

      # Its own commit, so a reviewer declines it by reverting it.
      - name: Commit the FormatJS bump
        if: steps.formatjs.outputs.message != ''
        env:
          MESSAGE: ${{ steps.formatjs.outputs.message }}
        run: git commit -m "$MESSAGE" -- server/package.json bun.lock

      - name: Open a pull request
        if: steps.branch.outputs.name != ''
        uses: ./.github/actions/open-superseding-pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.name }}
          title: bump tzdb to ${{ steps.bump.outputs.version }}
          supersedes: tzdb/
          body: |
            IANA released tzdb ${{ steps.bump.outputs.version }}: https://data.iana.org/time-zones/tzdb-${{ steps.bump.outputs.version }}/NEWS

            Read the diff to `common/src/timezone-catalog.gen.ts`. A row that disappears or an alias that moves changes what members with that timezone see.

            The server's timezone rules come from `@formatjs/intl-datetimeformat`. ${{ steps.formatjs.outputs.version && format('Its own commit bumps it to {0}, the latest release within the major version in `server/package.json`, which changes its tz data (`add-all-tz.js` SHA-1 {1}). To decline it, revert that commit and keep git''s default message: the watch won''t propose that tz data again.', steps.formatjs.outputs.version, steps.formatjs.outputs.tzdata) || steps.formatjs.outputs.declined && format('This leaves it alone: the latest release within the major version in `server/package.json` changes its tz data (`add-all-tz.js` SHA-1 {0}), but {1} declined that tz data.', steps.formatjs.outputs.tzdata, steps.formatjs.outputs.declined) || 'This leaves it alone: the latest release within the major version in `server/package.json` carries the tz data it has now.' }} Its changelog says which tzdb each release carries: https://github.com/formatjs/formatjs/blob/main/packages/intl-datetimeformat/CHANGELOG.md. If the server's FormatJS doesn't carry tzdb ${{ steps.bump.outputs.version }} yet, merging still updates the catalog, but the server keeps the older rules until FormatJS catches up.

            Typecheck and tests for `common`, and the server's typecheck and timezone test, passed in the job that opened this. CI hasn't run: close and reopen this pull request to start it.
