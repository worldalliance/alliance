name: Test Backend E2E

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string

jobs:
  test-backend-e2e:
    name: test-backend-e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Log Runner Environment
        run: |
          lscpu | grep 'Model name'
          echo "Runner image: $ImageOS $ImageVersion"
          echo "Bun: $(bun --version)"

      - name: Install Backend Dependencies
        run: bun install --frozen-lockfile
        working-directory: ./server

      - name: Install @alliance/common dependencies
        run: bun install --frozen-lockfile
        working-directory: ./common

      - name: Run E2E Tests
        run: bun run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=junit --reporter-outfile=junit.xml
        working-directory: ./server

      - name: Upload Per-File Timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-junit-${{ matrix.shard }}
          path: server/junit.xml
