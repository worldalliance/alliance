name: Deploy

on:
  push:
    branches: [main, production]

env:
  AWS_REGION: us-west-2
  env_name: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

jobs:
  # A production push deploys what its commit's fully green staging run
  # built, and otherwise checks and builds the commit itself.
  promote:
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.promote.outputs.run-id }}
      artifact-ids: ${{ steps.promote.outputs.artifact-ids }}
      details: ${{ steps.promote.outputs.details }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - id: promote
        uses: ./.github/actions/promote
        with:
          commit: ${{ github.sha }}

  checks:
    needs: promote
    if: ${{ !cancelled() && (github.ref_name != 'production' || (needs.promote.result == 'success' && !needs.promote.outputs.run-id)) }}
    uses: ./.github/workflows/deploy-checks.yaml
    with:
      environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

  # Checks run outside the lock. The group name is fixed, not built from
  # github.workflow, so other workflows deploying an environment can share it.
  deploy:
    needs:
      - promote
      - checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.promote.outputs.run-id) }}
    concurrency:
      group: deploy-${{ github.ref_name == 'production' && 'production' || 'staging' }}
      queue: max
    uses: ./.github/workflows/deploy-environment.yaml
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    with:
      environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
      commit: ${{ github.sha }}
      artifacts-run-id: ${{ needs.promote.outputs.run-id }}
      artifact-ids: ${{ needs.promote.outputs.artifact-ids || '{}' }}
      details: ${{ needs.promote.outputs.details || '{}' }}

  mobile-fingerprint-check:
    uses: ./.github/workflows/mobile-fingerprint-check.yaml
    permissions:
      contents: read
      id-token: write

  notify:
    runs-on: ubuntu-latest
    needs:
      - deploy
      - mobile-fingerprint-check
    if: >-
      ${{ always() && (needs.deploy.result != 'success'
      || needs.mobile-fingerprint-check.result != 'success') }}
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read CI secrets
        id: aws
        uses: ./.github/actions/aws
        with:
          role: ${{ env.env_name }}
          parameters: ci/shared/SLACK_WEBHOOK_URL_DEPLOYMENT

      - name: Compute Slack mention
        id: slack_mention
        uses: ./.github/actions/slack-mention
        with:
          github-username: ${{ github.actor }}

      - name: Post webhook
        env:
          WEBHOOK: ${{ fromJSON(steps.aws.outputs.secrets || '{}').SLACK_WEBHOOK_URL_DEPLOYMENT }}
          MENTION: ${{ steps.slack_mention.outputs.mention }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . .github/scripts/slack.sh
          SUBJECT=$(slack_commit_subject "$COMMIT_MESSAGE")
          FAILED=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name' | paste -sd, - | sed 's/,/, /g') \
            || FAILED='failed jobs unknown'
          slack_post "$WEBHOOK" \
            "${MENTION:+$MENTION }Deploy $env_name did not succeed for $SUBJECT${FAILED:+ ($FAILED)}. <$RUN_URL|Open run>"
