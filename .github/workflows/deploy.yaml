name: Deploy

on:
  push:
    branches: [main, production]

env:
  AWS_REGION: us-west-2
  env_name: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

jobs:
  dirty-check:
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dirty-check
        with:
          check: ${{ github.ref_name == 'production' && 'empty' || 'exists' }}

  # An artifact, not job outputs: Actions drops a job output that matches any
  # secret's value.
  deployed-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun scripts/deployed-config.ts "$env_name" > deployed-config.env
      - run: bun scripts/web-runtime-config.ts "$env_name" > web-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-config
          path: |
            deployed-config.env
            web-config.json

  test-backend-e2e:
    uses: ./.github/workflows/test-backend-e2e.yaml
    with:
      environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

  test-unit:
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            server,
            common,
            shared,
            sharedweb,
            apps/frontend,
            apps/admin,
            apps/mobile,
            scripts,
            .github,
            citesting,
            agents/hooks,
            agents/skills,
            agents/chats,
          ]
    uses: ./.github/workflows/test-unit.yaml
    with:
      package: ${{ matrix.package }}
      environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

  build-react-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate React Router Types
        run: bunx react-router typegen
        working-directory: ./apps/frontend

      - name: Typecheck
        run: bun typecheck
        working-directory: ./apps/frontend

      - name: Build React App
        run: bun run --cwd apps/frontend build
        env:
          VITE_APP_GIT_SHA: ${{ github.sha }}

      - name: Install PostHog CLI
        continue-on-error: true
        uses: ./.github/actions/posthog-cli

      - name: Inject source map ids
        continue-on-error: true
        run: posthog-cli sourcemap inject --directory ./apps/frontend/build/client/assets/

      - name: Upload Assets For Source Maps
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: react-assets
          path: apps/frontend/build/client/assets/

      - name: create output folder
        run: |
          rm -rf output
          mkdir output
          mv build output/build
          cp server.js output/server.js
          cp package.json output/package.json
          # Strip workspace:* deps and generate a standalone lockfile
          cd output
          sed -i '/workspace:\*/d' package.json
          bun install --lockfile-only
        working-directory: ./apps/frontend

      - name: Zip client + server
        run: |
          zip -r react-build.zip output
        working-directory: ./apps/frontend

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: apps/frontend/react-build.zip

  # Apart from build-react-app, so the frontend's build dependencies never
  # run where id-token: write reaches the environment role's Expo token.
  upload-react-sourcemaps:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - deployed-config
      - build-react-app
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read deployed config
        id: config
        uses: ./.github/actions/deployed-config

      - name: Read CI secrets
        id: aws
        uses: ./.github/actions/aws
        with:
          role: ${{ env.env_name }}
          parameters: ci/deploy/POSTHOG_SOURCEMAP_KEY

      - name: Download Assets
        uses: actions/download-artifact@v4
        with:
          name: react-assets
          path: react-assets

      - name: Install PostHog CLI
        uses: ./.github/actions/posthog-cli

      - name: Upload source maps to PostHog
        env:
          POSTHOG_CLI_ENV_ID: ${{ steps.config.outputs.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_TOKEN: ${{ fromJSON(steps.aws.outputs.secrets || '{}').POSTHOG_SOURCEMAP_KEY }}
        run: posthog-cli sourcemap upload --directory react-assets

  build-admin-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build React App
        run: bun run --cwd apps/admin build

      - name: Zip Build Output
        run: zip -r admin-build.zip build/client
        working-directory: ./apps/admin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: apps/admin/admin-build.zip

  actionlint:
    uses: ./.github/workflows/actionlint.yaml

  format-check:
    uses: ./.github/workflows/format-check.yaml

  gitignore-check:
    uses: ./.github/workflows/gitignore-check.yaml

  typecheck:
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            server,
            common,
            shared,
            sharedweb,
            apps/frontend,
            apps/admin,
            apps/mobile,
            citesting,
          ]
    uses: ./.github/workflows/typecheck.yaml
    with:
      package: ${{ matrix.package }}

  # The deploy jobs gate on this one job, so a check added here gates all of
  # them and they cannot drift apart.
  checks:
    runs-on: ubuntu-latest
    needs:
      - dirty-check
      - build-react-app
      - build-admin-frontend
      - test-backend-e2e
      - test-unit
      - migrations-drift-check
      - typecheck
      - format-check
      - gitignore-check
      - actionlint
      - mobile-bundle-check
    steps:
      - run: echo "all checks passed"

  # Checks run outside the lock. The group name is fixed, not built from
  # github.workflow, so other workflows deploying an environment can share it.
  deploy:
    needs:
      - deployed-config
      - checks
    concurrency:
      group: deploy-${{ github.ref_name == 'production' && 'production' || 'staging' }}
      queue: max
    uses: ./.github/workflows/deploy-environment.yaml
    permissions:
      contents: read
      deployments: write
      id-token: write
    with:
      environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
      commit: ${{ github.sha }}

  migrations-drift-check:
    uses: ./.github/workflows/migrations-drift-check.yaml

  mobile-bundle-check:
    uses: ./.github/workflows/mobile-bundle-check.yaml

  mobile-fingerprint-check:
    uses: ./.github/workflows/mobile-fingerprint-check.yaml
    permissions:
      contents: read
      id-token: write

  notify:
    runs-on: ubuntu-latest
    needs:
      - deployed-config
      - deploy
      - mobile-fingerprint-check
    if: >-
      ${{ always() && (needs.deployed-config.result != 'success'
      || needs.deploy.result != 'success'
      || needs.mobile-fingerprint-check.result != 'success') }}
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read CI secrets
        id: aws
        uses: ./.github/actions/aws
        with:
          role: ${{ env.env_name }}
          parameters: ci/shared/SLACK_WEBHOOK_URL_DEPLOYMENT

      - name: Compute Slack mention
        id: slack_mention
        uses: ./.github/actions/slack-mention
        with:
          github-username: ${{ github.actor }}

      - name: Post webhook
        env:
          WEBHOOK: ${{ fromJSON(steps.aws.outputs.secrets || '{}').SLACK_WEBHOOK_URL_DEPLOYMENT }}
          MENTION: ${{ steps.slack_mention.outputs.mention }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . .github/scripts/slack.sh
          SUBJECT=$(slack_commit_subject "$COMMIT_MESSAGE")
          FAILED=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name' | paste -sd, - | sed 's/,/, /g') \
            || FAILED='failed jobs unknown'
          slack_post "$WEBHOOK" \
            "${MENTION:+$MENTION }Deploy $env_name did not succeed for $SUBJECT${FAILED:+ ($FAILED)}. <$RUN_URL|Open run>"
