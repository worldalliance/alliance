name: Deploy

on:
  push:
    branches: [main, production]

env:
  AWS_REGION: us-west-2
  env_name: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

jobs:
  # An artifact, not job outputs: Actions drops a job output that matches any
  # secret's value.
  deployed-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun scripts/deployed-config.ts "$env_name" > deployed-config.env
      - run: bun scripts/web-runtime-config.ts "$env_name" > web-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-config
          path: |
            deployed-config.env
            web-config.json

  checks:
    uses: ./.github/workflows/deploy-checks.yaml
    with:
      environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

  # Apart from the build, so the frontend's build dependencies never run
  # where id-token: write reaches the environment role's Expo token.
  upload-react-sourcemaps:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - deployed-config
      - checks
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read deployed config
        id: config
        uses: ./.github/actions/deployed-config

      - name: Read CI secrets
        id: aws
        uses: ./.github/actions/aws
        with:
          role: ${{ env.env_name }}
          parameters: ci/deploy/POSTHOG_SOURCEMAP_KEY

      - name: Download Assets
        uses: actions/download-artifact@v4
        with:
          name: react-assets
          path: react-assets

      - name: Install PostHog CLI
        uses: ./.github/actions/posthog-cli

      - name: Upload source maps to PostHog
        env:
          POSTHOG_CLI_ENV_ID: ${{ steps.config.outputs.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_TOKEN: ${{ fromJSON(steps.aws.outputs.secrets || '{}').POSTHOG_SOURCEMAP_KEY }}
        run: posthog-cli sourcemap upload --directory react-assets

  # Checks run outside the lock. The group name is fixed, not built from
  # github.workflow, so other workflows deploying an environment can share it.
  deploy:
    needs:
      - deployed-config
      - checks
    concurrency:
      group: deploy-${{ github.ref_name == 'production' && 'production' || 'staging' }}
      queue: max
    uses: ./.github/workflows/deploy-environment.yaml
    permissions:
      contents: read
      deployments: write
      id-token: write
    with:
      environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
      commit: ${{ github.sha }}

  mobile-fingerprint-check:
    uses: ./.github/workflows/mobile-fingerprint-check.yaml
    permissions:
      contents: read
      id-token: write

  notify:
    runs-on: ubuntu-latest
    needs:
      - deployed-config
      - deploy
      - mobile-fingerprint-check
    if: >-
      ${{ always() && (needs.deployed-config.result != 'success'
      || needs.deploy.result != 'success'
      || needs.mobile-fingerprint-check.result != 'success') }}
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read CI secrets
        id: aws
        uses: ./.github/actions/aws
        with:
          role: ${{ env.env_name }}
          parameters: ci/shared/SLACK_WEBHOOK_URL_DEPLOYMENT

      - name: Compute Slack mention
        id: slack_mention
        uses: ./.github/actions/slack-mention
        with:
          github-username: ${{ github.actor }}

      - name: Post webhook
        env:
          WEBHOOK: ${{ fromJSON(steps.aws.outputs.secrets || '{}').SLACK_WEBHOOK_URL_DEPLOYMENT }}
          MENTION: ${{ steps.slack_mention.outputs.mention }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . .github/scripts/slack.sh
          SUBJECT=$(slack_commit_subject "$COMMIT_MESSAGE")
          FAILED=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name' | paste -sd, - | sed 's/,/, /g') \
            || FAILED='failed jobs unknown'
          slack_post "$WEBHOOK" \
            "${MENTION:+$MENTION }Deploy $env_name did not succeed for $SUBJECT${FAILED:+ ($FAILED)}. <$RUN_URL|Open run>"
