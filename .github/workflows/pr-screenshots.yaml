name: PR screenshots

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}
  # A cancelled main run never saves its APK.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A full restore rather than lookup-only counts as an access, so main's entry outlives GitHub's 7-day eviction.
      - uses: ./.github/actions/android-dev-apk

  capture:
    if: github.event.label.name == 'screenshots' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      OUTPUT_DIR: ${{ github.workspace }}/.scratch/pr-screenshots
      TOOLS_DIR: ${{ github.workspace }}/.scratch/pr-screenshots-tools
      AVD_IMAGE: system-images;android-34;google_apis;x86_64
      APP_VARIANT: development
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: alliance

    steps:
      - name: Require write access from whoever labeled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" -q .permission)"
          case "$permission" in
            admin | write) ;;
            *)
              echo "::error::$SENDER has $permission access; labeling needs write to run the agent"
              exit 1
              ;;
          esac

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd server && bun install --frozen-lockfile)
          (cd common && bun install --frozen-lockfile)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android emulator
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "emulator" "platform-tools" "$AVD_IMAGE" > /dev/null
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n pr -k "$AVD_IMAGE" -d pixel_7
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx pr
          nohup "$ANDROID_HOME/emulator/emulator" -avd pr -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 > "$RUNNER_TEMP/emulator.log" 2>&1 &

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Seed database
        run: |
          CITESTING_DB_NAME=alliance bun citesting/src/seed-database.ts
          jwt_secret="$(openssl rand -hex 32)"
          jwt_refresh_secret="$(openssl rand -hex 32)"
          cat > server/.env <<EOF
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_NAME=alliance
          NODE_ENV=test
          JWT_SECRET=$jwt_secret
          JWT_REFRESH_SECRET=$jwt_refresh_secret
          SMTP_HOST=localhost
          SMTP_USER=ci
          SMTP_PASSWORD=ci
          APP_URL=http://localhost:5173
          ADMIN_URL=http://localhost:5174
          TZ=UTC
          EOF

      - uses: ./.github/actions/android-dev-apk
        id: apk

      - name: Install Android app
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: |
          timeout 600 adb wait-for-device
          booted() { [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; }
          for _ in $(seq 120); do booted && break; sleep 5; done
          booted
          adb install "$APK"

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Take screenshots
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASH_DEFAULT_TIMEOUT_MS: "600000"
        run: |
          set -o pipefail
          BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          export BASE_SHA
          mkdir -p "$OUTPUT_DIR" "$TOOLS_DIR"
          # Outside git's reach, so a checkout of the base leaves them in place.
          cp .github/pr-screenshots/*.ts "$TOOLS_DIR"
          # On stdin, not argv, so a `ps | grep` for a command the prompt names can't match claude.
          claude -p \
            --dangerously-skip-permissions \
            --output-format stream-json \
            --verbose \
            --model claude-opus-5-5 \
            < .github/pr-screenshots/prompt.md \
            | tee "$RUNNER_TEMP/transcript.jsonl"
          test -s "$OUTPUT_DIR/comment.md"
          if grep -rqF -- "$CLAUDE_CODE_OAUTH_TOKEN" "$OUTPUT_DIR"; then
            echo "::error::the agent wrote its OAuth token into $OUTPUT_DIR, which would publish it"
            exit 1
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots
          path: ${{ env.OUTPUT_DIR }}
          include-hidden-files: true

      # Artifacts are public here and, unlike logs, not secret-masked.
      - name: Redact transcript and logs
        id: redact
        if: always()
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          shopt -s nullglob
          for file in "$RUNNER_TEMP/transcript.jsonl" "$TOOLS_DIR"/run/*.log; do
            if [ -n "$TOKEN" ] && [ -f "$file" ]; then
              perl -pi -e 's/\Q$ENV{TOKEN}\E/[redacted]/g' "$file"
            fi
          done

      - name: Upload transcript and logs
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots-transcript
          retention-days: 7
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/transcript.jsonl
            ${{ runner.temp }}/emulator.log
            ${{ env.TOOLS_DIR }}/run/*.log

  post:
    needs: capture
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: pr-screenshots
          path: out

      - name: Comment on PR
        working-directory: out
        env:
          GH_TOKEN: ${{ secrets.PR_SCREENSHOTS_GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PR_SCREENSHOTS_GH_TOKEN is not set; gh pr comment --attach needs a user token"
            exit 1
          fi
          attachments=()
          for file in *; do
            [ "$file" = comment.md ] || attachments+=(--attach "./$file")
          done
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md "${attachments[@]}"
