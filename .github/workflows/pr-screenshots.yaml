name: PR screenshots

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.label.name == 'screenshots' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      OUTPUT_DIR: ${{ github.workspace }}/.scratch/pr-screenshots
      AVD_IMAGE: system-images;android-34;google_apis;x86_64

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd server && bun install --frozen-lockfile)
          (cd common && bun install --frozen-lockfile)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android emulator
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "emulator" "platform-tools" "$AVD_IMAGE" > /dev/null
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n pr -k "$AVD_IMAGE" -d pixel_7
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx pr
          nohup "$ANDROID_HOME/emulator/emulator" -avd pr -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 > "$RUNNER_TEMP/emulator.log" 2>&1 &

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Seed database
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          jwt_refresh_secret="$(openssl rand -hex 32)"
          cat > server/.env <<EOF
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_NAME=alliance
          NODE_ENV=development
          JWT_SECRET=$jwt_secret
          JWT_REFRESH_SECRET=$jwt_refresh_secret
          SMTP_HOST=localhost
          SMTP_USER=ci
          SMTP_PASSWORD=ci
          APP_URL=http://localhost:5173
          ADMIN_URL=http://localhost:5174
          TZ=UTC
          EOF
          psql -d postgres -c 'CREATE DATABASE alliance'
          (cd server && bunx typeorm-ts-node-commonjs --dataSource src/datasources/dataSource.ts migration:run)
          {
            echo "SET session_replication_role = 'replica';"
            grep -Ev '^(SET transaction_timeout|\\restrict|\\unrestrict)' citesting/fixtures/seed_dataonly.sql
            echo "SET session_replication_role = 'origin';"
          } | psql -d alliance -v ON_ERROR_STOP=1 > /dev/null

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: bun.lock

      - name: Build and install Android app
        working-directory: apps/mobile
        env:
          APP_VARIANT: development
          CI: "true"
        run: |
          bunx expo prebuild --platform android
          (cd android && ./gradlew app:assembleDebug -PreactNativeArchitectures=x86_64)
          timeout 600 adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 5; done
          adb install android/app/build/outputs/apk/debug/app-debug.apk

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Take screenshots
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          mkdir -p "$OUTPUT_DIR"
          claude -p "$(cat .github/pr-screenshots/prompt.md)" \
            --dangerously-skip-permissions \
            --output-format stream-json \
            --verbose \
            --model claude-opus-5-5 \
            | tee "$RUNNER_TEMP/transcript.jsonl"
          test -s "$OUTPUT_DIR/comment.md"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots
          path: ${{ env.OUTPUT_DIR }}
          include-hidden-files: true

      - name: Upload transcript and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots-transcript
          path: |
            ${{ runner.temp }}/transcript.jsonl
            ${{ runner.temp }}/emulator.log

  post:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: pr-screenshots
          path: out

      - name: Comment on PR
        working-directory: out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          attachments=()
          for file in *; do
            [ "$file" = comment.md ] || attachments+=(--attach "./$file")
          done
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md "${attachments[@]}"
