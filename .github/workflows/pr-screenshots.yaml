name: PR screenshots
run-name: "PR screenshots · #${{ inputs.pr }} · ${{ inputs.platform }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Exact reviewed PR head SHA (40 characters)
        required: true
        type: string
      platform:
        description: Native device available to the agent (browser is always available)
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
      focus:
        description: Optional journey or behavior to investigate
        type: string

permissions:
  contents: read

concurrency:
  group: pr-screenshots-${{ inputs.pr }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      pr: ${{ steps.request.outputs.pr }}
      base: ${{ steps.request.outputs.base }}
      head: ${{ steps.request.outputs.head }}
      head_repo: ${{ steps.request.outputs.head_repo }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        id: request
        env:
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          RERUN_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const { resolveRequest } = require('./.github/scripts/pr-screenshots.cjs');
            await resolveRequest({ github, context, core });

  capture:
    needs: resolve
    outputs:
      artifact_url: ${{ steps.evidence.outputs.artifact-url }}
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base }}
          path: before
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.resolve.outputs.head_repo }}
          ref: ${{ needs.resolve.outputs.head }}
          path: after
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Prepare device and host tools
        timeout-minutes: 15
        env:
          NATIVE_PLATFORM: ${{ inputs.platform }}
        run: bash controller/.github/scripts/pr-screenshots-setup.sh
      - name: Write capture context
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          BASE_SHA: ${{ needs.resolve.outputs.base }}
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
          NATIVE_PLATFORM: ${{ inputs.platform }}
          CAPTURE_FOCUS: ${{ inputs.focus }}
        run: |
          mkdir -p .scratch/pr-screenshots/evidence
          jq -n '{pr: env.PR_NUMBER, base: env.BASE_SHA, head: env.HEAD_SHA, platform: env.NATIVE_PLATFORM, focus: env.CAPTURE_FOCUS}' > .scratch/pr-screenshots/context.json
      - name: Start isolated Claude credential proxy
        env:
          CLAUDE_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          test -n "$CLAUDE_CREDENTIAL"
          proxy_info="$PWD/.scratch/pr-screenshots/claude-proxy.json"
          sudo -n env -u CLAUDE_CREDENTIAL -u NODE_OPTIONS "$(command -v node)" --disable-sigusr1 controller/.github/scripts/claude-proxy.cjs "$proxy_info" <<< "$CLAUDE_CREDENTIAL" &
          for _ in {1..30}; do
            if [ -s "$proxy_info" ]; then exit 0; fi
            sleep 1
          done
          echo 'Claude credential proxy did not start' >&2
          exit 1
      - name: Remove privileged access before executing PR code
        run: |
          if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then exit 1; fi
          if [ "$RUNNER_OS" = Linux ]; then
            sudo find /run -type s -user root -exec chmod go-rwx {} +
          fi
          sudo sh -c 'printf "\n%s ALL=(ALL:ALL) !ALL\n" "$1" >> /etc/sudoers' sh "$(id -un)"
          if sudo -n true 2>/dev/null; then exit 1; fi
      - name: Explore and capture before and after
        timeout-minutes: 65
        run: bash controller/.github/scripts/pr-screenshots-claude.sh
        env:
          CI: "true"
          BROWSER: none
          MAESTRO_CLI_NO_ANALYTICS: "1"
          EXPO_NO_TELEMETRY: "1"
      - name: Upload capture evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots-${{ inputs.platform }}
          path: |
            .scratch/pr-screenshots/evidence/*.png
            .scratch/pr-screenshots/evidence/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, capture]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pr-screenshots-${{ inputs.platform }}
          path: .scratch/pr-screenshots/evidence
      - uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          BASE_SHA: ${{ needs.resolve.outputs.base }}
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
          NATIVE_PLATFORM: ${{ inputs.platform }}
          ARTIFACT_URL: ${{ needs.capture.outputs.artifact_url }}
        with:
          script: |
            const { publishEvidence } = require('./.github/scripts/pr-screenshots.cjs');
            await publishEvidence({ github, context });
