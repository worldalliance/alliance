name: Deploy checks

# The checks and builds a deploy gates on. The builds upload the
# react-build and admin-build artifacts deploy-environment.yaml deploys, and
# the react-assets source maps it uploads to PostHog.

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production; the environment the tests run in.
        type: string
        required: true

permissions:
  contents: read

jobs:
  dirty-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dirty-check
        with:
          check: exists

  test-backend-e2e:
    uses: ./.github/workflows/test-backend-e2e.yaml
    with:
      environment: ${{ inputs.environment }}

  test-unit:
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            server,
            common,
            kora-review,
            shared,
            sharedweb,
            apps/frontend,
            apps/admin,
            apps/mobile,
            scripts,
            .github,
            citesting,
            agents/hooks,
            agents/skills,
            agents/chats,
          ]
    uses: ./.github/workflows/test-unit.yaml
    with:
      package: ${{ matrix.package }}
      environment: ${{ inputs.environment }}

  build-react-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate React Router Types
        run: bunx react-router typegen
        working-directory: ./apps/frontend

      - name: Typecheck
        run: bun typecheck
        working-directory: ./apps/frontend

      - name: Build React App
        run: bun run --cwd apps/frontend build
        env:
          VITE_APP_GIT_SHA: ${{ github.sha }}

      - name: Install PostHog CLI
        continue-on-error: true
        uses: ./.github/actions/posthog-cli

      - name: Inject source map ids
        continue-on-error: true
        run: posthog-cli sourcemap inject --directory ./apps/frontend/build/client/assets/

      - name: Upload Assets For Source Maps
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: react-assets
          path: apps/frontend/build/client/assets/

      - name: create output folder
        run: |
          rm -rf output
          mkdir output
          mv build output/build
          cp server.js output/server.js
          cp package.json output/package.json
          # Strip workspace:* deps and generate a standalone lockfile
          cd output
          sed -i '/workspace:\*/d' package.json
          bun install --lockfile-only
        working-directory: ./apps/frontend

      - name: Zip client + server
        run: |
          zip -r react-build.zip output
        working-directory: ./apps/frontend

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: apps/frontend/react-build.zip

  build-admin-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build React App
        run: bun run --cwd apps/admin build

      - name: Zip Build Output
        run: zip -r admin-build.zip build/client
        working-directory: ./apps/admin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: apps/admin/admin-build.zip

  actionlint:
    uses: ./.github/workflows/actionlint.yaml

  format-check:
    uses: ./.github/workflows/format-check.yaml

  gitignore-check:
    uses: ./.github/workflows/gitignore-check.yaml

  typecheck:
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            server,
            common,
            kora-review,
            shared,
            sharedweb,
            apps/frontend,
            apps/admin,
            apps/mobile,
            citesting,
          ]
    uses: ./.github/workflows/typecheck.yaml
    with:
      package: ${{ matrix.package }}

  migrations-drift-check:
    uses: ./.github/workflows/migrations-drift-check.yaml

  mobile-bundle-check:
    uses: ./.github/workflows/mobile-bundle-check.yaml

  # One job standing for every check and build, which promotion's required
  # list (.github/actions/promote/promote.sh) names.
  passed:
    runs-on: ubuntu-latest
    needs:
      - dirty-check
      - build-react-app
      - build-admin-frontend
      - test-backend-e2e
      - test-unit
      - migrations-drift-check
      - typecheck
      - format-check
      - gitignore-check
      - actionlint
      - mobile-bundle-check
    steps:
      - run: echo "all checks passed"
