name: Test Unit

on:
  workflow_call:
    inputs:
      package:
        description: "Workspace directory to run bun test in (e.g. shared, apps/frontend)"
        required: true
        type: string
      environment:
        required: false
        type: string

jobs:
  test-unit:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Runs through scripts/test-all.sh so the discovery/skip rule lives in one
      # place and `bun run test` locally behaves identically to CI.
      - name: Run Unit Tests
        run: scripts/test-all.sh "${{ inputs.package }}"
