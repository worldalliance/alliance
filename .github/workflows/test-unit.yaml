name: Test Unit

on:
  workflow_call:
    inputs:
      package:
        description: "Workspace directory to run bun test in (e.g. shared, apps/frontend)"
        required: true
        type: string
      environment:
        required: false
        type: string

jobs:
  test-unit:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        working-directory: ${{ inputs.package }}
        run: |
          # Mirrors bun test's discovery glob: **{.test,.spec,_test_,_spec_}.{js,ts,jsx,tsx}
          if find . -name node_modules -prune -o -type f -print | grep -Eq '(\.test|\.spec|_test_|_spec_)\.(js|ts|jsx|tsx)$'; then
            bun test
          else
            echo "No test files in ${{ inputs.package }} — skipping."
          fi
