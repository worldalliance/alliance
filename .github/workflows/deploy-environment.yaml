name: Deploy environment

# Deploys a commit whose checks and builds already passed, with its deployed
# config and the build artifacts of the calling run or of the run that checked
# it, then smoke-checks it, uploads its source maps and records the result as a
# GitHub deployment. The caller holds the environment's deploy lock around the
# whole call.

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        type: string
        required: true
      commit:
        description: Full SHA of the commit to deploy.
        type: string
        required: true
      artifacts-run-id:
        description: The run whose build artifacts to deploy, which must have built `commit`; empty for the calling run.
        type: string
        default: ""
      artifact-ids:
        description: JSON object of the ids of artifacts-run-id's react-build, admin-build and react-assets artifacts, by name; a missing id fails the download that needs it.
        type: string
        default: "{}"
      details:
        description: JSON object recorded as the deployment's payload.
        type: string
        default: "{}"

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  env_name: ${{ inputs.environment }}

jobs:
  # An artifact, not job outputs: Actions drops a job output that matches any
  # secret's value.
  deployed-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Refuse while production is frozen
        if: inputs.environment == 'production'
        uses: ./.github/actions/dirty-check
        with:
          check: empty
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun scripts/deployed-config.ts "$env_name" > deployed-config.env
      - run: bun scripts/web-runtime-config.ts "$env_name" > web-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-config
          path: |
            deployed-config.env
            web-config.json

  # After deployed-config, so a config failure or the production freeze
  # deploys nothing.
  guard:
    needs: deployed-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # A partial re-run keeps these outputs from the attempt that ran the
    # guard, so every later job but the source map upload refuses to run in
    # any other attempt.
    outputs:
      deployment_id: ${{ steps.guard.outputs.deployment_id }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: .github/actions/deploy-guard

      - id: guard
        uses: ./.github/actions/deploy-guard
        with:
          environment: ${{ inputs.environment }}
          commit: ${{ inputs.commit }}
          details: ${{ inputs.details }}

  deploy-nest-backend:
    runs-on: ubuntu-latest
    needs: guard
    if: ${{ needs.guard.outputs.deployment_id }}
    environment: ${{ inputs.environment }}-hosts
    permissions:
      contents: read
      id-token: write
    steps:
      - &refuse-partial-rerun
        name: Refuse a partial re-run
        if: needs.guard.outputs.attempt != github.run_attempt
        run: |
          echo "::error::The guard last ran in attempt ${{ needs.guard.outputs.attempt }}, so it hasn't judged whether this commit is stale. Use Re-run all jobs."
          exit 1

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Zip backend deploy workspace
        run: |
          rm -f nest-build.zip
          zip -r nest-build.zip \
            package.json \
            bun.lock \
            bunfig.toml \
            tsconfig.base.json \
            server/package.json \
            server/bunfig.toml \
            server/tsconfig.json \
            server/src \
            server/migrations \
            server/scripts \
            scripts/deploy_backend.sh \
            scripts/deployed-config-arg.ts \
            scripts/deployed-db-name.ts \
            scripts/secrets_run.sh \
            scripts/sync_prod_to_staging.sh \
            scripts/with_db_env.sh \
            scripts/anonymize \
            deploy/systemd \
            common/package.json \
            common/tsconfig.json \
            common/src \
            kora-review/package.json \
            kora-review/bunfig.toml \
            kora-review/tsconfig.json \
            kora-review/src \
            apps/admin/package.json \
            apps/frontend/package.json \
            apps/mobile/package.json \
            citesting/package.json \
            shared/package.json \
            sharedweb/package.json

      - name: Deploy Backend on EC2
        uses: ./.github/actions/run-on-host
        with:
          environment: ${{ env.env_name }}
          files: nest-build.zip
          timeout-minutes: 45
          script: |
            set -Euo pipefail

            sudo yum install -y unzip
            command -v unzip >/dev/null || { echo "unzip is required; yum install failed"; exit 1; }

            # Install Bun
            BUN_VERSION=1.4.4
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
            if [ "$(bun --version 2>/dev/null)" != "$BUN_VERSION" ]; then
              curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
            fi
            bun --version | grep -qx "$BUN_VERSION" || { echo "bun $BUN_VERSION required, got $(bun --version 2>/dev/null || echo none)"; exit 1; }

            # Node is needed for pm2.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] || { echo "nvm missing ($NVM_DIR/nvm.sh) — provision node on this host before deploying"; exit 1; }
            \. "$NVM_DIR/nvm.sh"
            command -v node &> /dev/null || { echo "node missing after nvm setup"; exit 1; }
            command -v pm2 &> /dev/null || bun add -g pm2

            cd ~/

            export NODE_ENV=${{ inputs.environment }}

            deploy_backend=$(unzip -p ~/nest-build.zip scripts/deploy_backend.sh) || { echo "could not extract deploy_backend.sh"; exit 1; }
            bash -c "$deploy_backend" || exit 1

            # The prod → staging sync runs from this box, outside the app, so
            # ship its script and schedule with the deploy. Staging only. Never
            # fails the deploy
            if [ "${{ inputs.environment }}" != production ]; then
              install -m 755 ~/nest-backend/scripts/sync_prod_to_staging.sh \
                ~/sync_prod_to_staging.sh.new \
                && mv -f ~/sync_prod_to_staging.sh.new ~/sync_prod_to_staging.sh \
                && echo "installed ~/sync_prod_to_staging.sh" \
                || echo "WARNING: could not install sync_prod_to_staging.sh"

              # No restart: on the host's systemd, restarting the timer runs
              # the sync at once if a scheduled time passed since the timer's
              # previous start. daemon-reload applies edited units.
              sudo install -m 644 ~/nest-backend/deploy/systemd/alliance-prod-to-staging-sync.{service,timer} \
                /etc/systemd/system/ \
                && sudo systemctl daemon-reload \
                && sudo systemctl enable --now alliance-prod-to-staging-sync.timer \
                && echo "installed alliance-prod-to-staging-sync.timer" \
                || echo "::warning::could not install alliance-prod-to-staging-sync.timer"
            fi

  deploy-react-app:
    runs-on: ubuntu-latest
    needs:
      - guard
      - deploy-nest-backend
    environment: ${{ inputs.environment }}-hosts
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - *refuse-partial-rerun

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Read deployed config
        id: config
        uses: ./.github/actions/deployed-config

      # Another run's artifacts download by the ids recorded for them, so an
      # artifact a later attempt re-uploaded fails the download instead of
      # being deployed. A missing id fails too, instead of fetching every
      # artifact. merge-multiple puts a by-id download where a by-name one
      # lands, not in a directory named for the artifact.
      - name: Download React Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ !inputs.artifacts-run-id && 'react-build' || '' }}
          artifact-ids: ${{ inputs.artifacts-run-id && (fromJSON(inputs.artifact-ids)['react-build'] || 'none') || '' }}
          merge-multiple: true
          run-id: ${{ inputs.artifacts-run-id }}
          github-token: ${{ inputs.artifacts-run-id && github.token || '' }}

      - name: Deploy frontend SSR on EC2
        uses: ./.github/actions/run-on-host
        with:
          environment: ${{ env.env_name }}
          files: |
            deploy/nginx/alliance.conf
            deploy/nginx/check-cert.sh
            react-build.zip
          script: |
            df -h ~
            df -hi ~
            avail_kb=$(df --output=avail -k ~ | tail -1)
            [ "$avail_kb" -ge 3145728 ] || { echo "::error::Under 3G free on the EC2 host; the unzip and install would fail. Free space there before deploying."; exit 1; }
            avail_inodes=$(df --output=iavail ~ | tail -1)
            [ "$avail_inodes" -ge 100000 ] || { echo "::error::Under 100k free inodes on the EC2 host; the unzip and install would fail. Free inodes there before deploying."; exit 1; }

            DOMAIN='${{ steps.config.outputs.DOMAIN_NAME }}'
            LEGACY_DOMAIN='${{ steps.config.outputs.LEGACY_DOMAIN_NAME }}'
            NEW_DOMAIN='${{ steps.config.outputs.NEW_DOMAIN_NAME }}'
            # This runs before anything on the host changes. CERT_NAMES mirrors
            # alliance.conf's server_name, minus staging's www. names, which its
            # DNS doesn't serve.
            CERT_NAMES="$LEGACY_DOMAIN $NEW_DOMAIN"
            [ '${{ env.env_name }}' = production ] && CERT_NAMES="$CERT_NAMES www.$LEGACY_DOMAIN www.$NEW_DOMAIN"
            sudo bash ~/check-cert.sh "$DOMAIN" $CERT_NAMES || exit 1

            sudo yum install -y unzip nginx

            # Install Bun
            BUN_VERSION=1.4.4
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
            if [ "$(bun --version 2>/dev/null)" != "$BUN_VERSION" ]; then
              curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
            fi
            bun --version | grep -qx "$BUN_VERSION" || { echo "bun $BUN_VERSION required, got $(bun --version 2>/dev/null || echo none)"; exit 1; }

            # Node is needed for pm2.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] || { echo "nvm missing ($NVM_DIR/nvm.sh) — provision node on this host before deploying"; exit 1; }
            \. "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm use 22
            nvm alias default 22
            command -v node &> /dev/null || { echo "node missing after nvm setup"; exit 1; }
            command -v pm2 &> /dev/null || bun add -g pm2

            cd ~/

            unzip -o -DD ~/react-build.zip
            # BACKCOMPAT(prerender): earlier builds prerendered these, and
            # express.static would serve them, with that build's config, until
            # the prune below. Remove once this has deployed to staging and
            # production.
            rm -f ~/output/build/client/index.html ~/output/build/client/guide/index.html

            cd ~/output
            # node_modules isn't in the zip; clear it so the frozen install
            # builds a clean tree
            rm -rf node_modules
            # The script runs without `set -e`; make it fatal explicitly.
            bun install --frozen-lockfile --production || { echo "bun install failed"; exit 1; }
            # Installs hardlink out of the cache, so node_modules survives this.
            bun pm cache rm || echo "::warning::bun pm cache rm failed; the disk fills up unless the Bun cache is cleared"

            pm2 delete client-ssr || true
            pm2 start "NODE_ENV=${{ inputs.environment }} node server.js" --name client-ssr
            pm2 save
            pm2 jlist | grep -q '"name":"pm2-logrotate"' || pm2 install pm2-logrotate || echo "::warning::pm2-logrotate install failed; pm2 logs grow unbounded"

            # unzip -o keeps earlier builds' hashed files, and -DD dates this
            # build's to now. Keeping a week of them serves old chunks to pages
            # loaded before this deploy, when deploys are under a week apart.
            find ~/output/build -type f -mtime +7 -delete || echo "::warning::could not prune old build files from ~/output/build"

            sudo mkdir -p /var/www/certbot
            # nginx creates the video cache directory, owned by its workers,
            # only inside a parent that exists.
            sudo mkdir -p /var/cache/nginx
            # alliance.conf owns the port 80 default, so clearing the packaged
            # default.conf belongs with it, not with the admin panel.
            sudo rm -f /etc/nginx/conf.d/default.conf
            # nginx serves /assets/ off disk under this directory, so it needs
            # to traverse it.
            chmod o+x /home/ec2-user
            # Source of truth is deploy/nginx/alliance.conf, uploaded to
            # ~/alliance.conf; substitute the per-environment domains into
            # server_name + cert paths.
            sed -e "s/__DOMAIN__/$DOMAIN/g" -e "s/__LEGACY_DOMAIN__/$LEGACY_DOMAIN/g" \
              -e "s/__NEW_DOMAIN__/$NEW_DOMAIN/g" ~/alliance.conf \
              | sudo tee /etc/nginx/conf.d/alliance.conf > /dev/null
            sudo nginx -t || { echo "nginx config invalid"; exit 1; }
            sudo systemctl reload nginx

  deploy-admin-app:
    runs-on: ubuntu-latest
    needs:
      - guard
      - deploy-nest-backend
      - deploy-react-app
    environment: ${{ inputs.environment }}-hosts
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - *refuse-partial-rerun

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Read deployed config
        id: config
        uses: ./.github/actions/deployed-config

      # Selected as in deploy-react-app's download.
      - name: Download Admin Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ !inputs.artifacts-run-id && 'admin-build' || '' }}
          artifact-ids: ${{ inputs.artifacts-run-id && (fromJSON(inputs.artifact-ids)['admin-build'] || 'none') || '' }}
          merge-multiple: true
          run-id: ${{ inputs.artifacts-run-id }}
          github-token: ${{ inputs.artifacts-run-id && github.token || '' }}

      - name: Deploy admin on EC2
        uses: ./.github/actions/run-on-host
        with:
          environment: ${{ env.env_name }}
          files: |
            deploy/nginx/alliance_admin.conf
            deploy/nginx/alliance_admin_http.conf
            deploy/nginx/check-cert.sh
            admin-build.zip
            web-config.json
          script: |
            sudo yum install -y unzip nginx

            chmod o+x /home/ec2-user

            DOMAIN='${{ steps.config.outputs.DOMAIN_NAME }}'
            LEGACY_DOMAIN='${{ steps.config.outputs.LEGACY_DOMAIN_NAME }}'
            NEW_DOMAIN='${{ steps.config.outputs.NEW_DOMAIN_NAME }}'
            sudo mkdir -p /var/www/certbot

            render () {
              sed -e "s/__DOMAIN__/$DOMAIN/g" -e "s/__LEGACY_DOMAIN__/$LEGACY_DOMAIN/g" \
                -e "s/__NEW_DOMAIN__/$NEW_DOMAIN/g" "$HOME/$1" \
                | sudo tee "/etc/nginx/conf.d/$1" > /dev/null
            }

            reload () {
              sudo nginx -t || { echo "nginx config invalid"; exit 1; }
              sudo systemctl reload nginx || { echo "nginx reload failed"; exit 1; }
            }

            # The port 80 vhost lands first and unconditionally: it serves the
            # ACME challenge, so the cert below cannot be issued until it is
            # live. admin.conf is its predecessor and would claim the same
            # server_name.
            render alliance_admin_http.conf
            sudo rm -f /etc/nginx/conf.d/admin.conf
            reload

            sudo bash ~/check-cert.sh "admin.$DOMAIN" "admin.$LEGACY_DOMAIN" "admin.$NEW_DOMAIN" || exit 1

            render alliance_admin.conf
            reload

            # After the vhost, which serves routes the bundle needs, such as
            # /config.json. A failed cert check above also exits before this,
            # leaving the old bundle and its config live.
            mkdir -p ~/admin-config
            mv ~/web-config.json ~/admin-config/config.json || { echo "could not install config.json"; exit 1; }
            unzip -o -DD ~/admin-build.zip -d ~/admin-app || { echo "unzip of the admin bundle failed"; exit 1; }
            # Same pruning as the frontend deploy's ~/output/build.
            find ~/admin-app -type f -mtime +7 -delete || echo "::warning::could not prune old build files from ~/admin-app"

  verify-deployment:
    needs:
      - guard
      - deploy-nest-backend
      - deploy-react-app
      - deploy-admin-app
    runs-on: ubuntu-latest
    steps:
      - *refuse-partial-rerun

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: .github/actions/deployed-config

      - name: Read deployed config
        id: config
        uses: ./.github/actions/deployed-config

      - name: Check main app
        run: |
          echo "Checking main app..."
          curl --fail --silent --show-error http://${{ steps.config.outputs.DOMAIN_NAME }} > /dev/null
          echo "main app is reachable"

      - name: Check main app on the other domain
        run: |
          echo "Checking main app on ${{ steps.config.outputs.ALT_DOMAIN_NAME }}..."
          curl --fail --silent --show-error http://${{ steps.config.outputs.ALT_DOMAIN_NAME }} > /dev/null
          echo "main app is reachable on the other domain"

      - name: Check admin app
        run: |
          echo "Checking admin app..."
          curl --fail --silent --show-error http://admin.${{ steps.config.outputs.DOMAIN_NAME }} > /dev/null
          echo "admin app is reachable"

  verify-https:
    needs:
      - guard
      - deploy-nest-backend
      - deploy-react-app
      - deploy-admin-app
    runs-on: ubuntu-latest
    steps:
      - *refuse-partial-rerun

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: .github/actions/deployed-config

      - name: Read deployed config
        id: config
        uses: ./.github/actions/deployed-config

      - name: Check main app
        run: |
          echo "Checking main app..."
          curl --fail --silent --show-error https://${{ steps.config.outputs.DOMAIN_NAME }} > /dev/null
          echo "main app https ok"

      # The legacy domain sends navigations, and requests asking for HTML
      # without Sec-Fetch-Mode, to the new domain, and still answers fetches
      # from tabs loaded before the cutover, old browsers' included. The new
      # domain serves pages.
      - name: Check page loads on both domains
        env:
          LEGACY: ${{ steps.config.outputs.LEGACY_DOMAIN_NAME }}
          NEW: ${{ steps.config.outputs.NEW_DOMAIN_NAME }}
        run: |
          moved="https://$NEW/tasks?check=1"
          for probe in "$LEGACY navigate $moved" "$LEGACY html $moved" "$LEGACY none " "$LEGACY cors " "$NEW navigate " "$NEW cors "; do
            read -r host mode expected <<< "$probe"
            url="https://$host/tasks?check=1"
            case "$mode" in
              html) header=(-H "Accept: text/html") ;;
              none) header=() ;;
              *) header=(-H "Sec-Fetch-Mode: $mode") ;;
            esac
            location=$(curl --fail --silent --show-error -o /dev/null -w '%{redirect_url}' "${header[@]}" "$url")
            if [ "$location" != "$expected" ]; then
              echo "$url probed as $mode redirected to '$location', expected '$expected'"
              exit 1
            fi
          done
          echo "page loads ok"

      # Apple and Android fetch each host's association file without following
      # redirects.
      - name: Check app association files
        env:
          HOSTS: ${{ steps.config.outputs.LEGACY_DOMAIN_NAME }} ${{ steps.config.outputs.NEW_DOMAIN_NAME }}
        run: |
          for host in $HOSTS; do
            for path in .well-known/assetlinks.json .well-known/apple-app-site-association; do
              status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' "https://$host/$path")
              if [ "$status" != 200 ]; then echo "https://$host/$path answered $status"; exit 1; fi
            done
          done
          echo "association files ok"

      - name: Check admin app
        run: |
          echo "Checking admin app..."
          curl --fail --silent --show-error https://admin.${{ steps.config.outputs.DOMAIN_NAME }} > /dev/null
          echo "admin app https ok"

      - name: Check admin app on the other domain
        run: |
          echo "Checking admin app on admin.${{ steps.config.outputs.ALT_DOMAIN_NAME }}..."
          curl --fail --silent --show-error https://admin.${{ steps.config.outputs.ALT_DOMAIN_NAME }} > /dev/null
          echo "admin other domain https ok"

      - name: Check admin config
        run: |
          set -o pipefail
          curl --fail --silent --show-error https://admin.${{ steps.config.outputs.DOMAIN_NAME }}/config.json | jq -e --slurpfile want web-config.json '. == $want[0]' > /dev/null
          echo "admin config.json ok"

      # nginx -t can pass while every /events/ request fails, e.g. on PostHog's
      # certificate. Last, so a PostHog outage doesn't skip the checks above.
      - name: Check PostHog proxy
        env:
          LEGACY: ${{ steps.config.outputs.LEGACY_DOMAIN_NAME }}
          NEW: ${{ steps.config.outputs.NEW_DOMAIN_NAME }}
        run: |
          for probe in "$NEW 200" "$LEGACY 410"; do
            read -r host expected <<< "$probe"
            status=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "https://$host/events/static/array.js")
            if [ "$status" != "$expected" ]; then echo "https://$host/events/static/array.js answered $status, expected $expected"; exit 1; fi
          done
          echo "PostHog proxy https ok"

  verify-api:
    needs:
      - guard
      - deploy-nest-backend
      - deploy-react-app
      - deploy-admin-app
    runs-on: ubuntu-latest
    steps:
      - *refuse-partial-rerun

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: .github/actions/deployed-config

      - name: Read deployed config
        id: config
        uses: ./.github/actions/deployed-config

      - name: Check API health
        env:
          LEGACY: ${{ steps.config.outputs.LEGACY_DOMAIN_NAME }}
          NEW: ${{ steps.config.outputs.NEW_DOMAIN_NAME }}
        run: |
          image='/api/images/check.webp?check=1'
          for probe in "$NEW /api/ 200 " "$LEGACY /api/ 410 " "$LEGACY $image 301 https://$NEW$image"; do
            read -r host path expected location <<< "$probe"
            got=$(curl --silent --show-error -o /dev/null -w '%{http_code} %{redirect_url}' "https://$host$path")
            if [ "$got" != "$expected ${location:-}" ]; then echo "https://$host$path answered '$got', expected '$expected ${location:-}'"; exit 1; fi
          done
          echo "API health ok"

  # Apart from the build, so the frontend's build dependencies never run where
  # id-token: write reaches the environment role's Expo token. A promotion
  # uploads staging's source maps to production's PostHog project. Every step,
  # not the job, continues on error, and the steps' timeouts sum to less than
  # the job's: a failed job inside a called workflow may fail the calling job,
  # which Deploy alerts on.
  upload-react-sourcemaps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: guard
    if: ${{ needs.guard.outputs.deployment_id }}
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Read deployed config
        id: config
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/deployed-config

      - name: Read CI secrets
        id: aws
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/aws
        with:
          role: ${{ env.env_name }}
          parameters: ci/deploy/POSTHOG_SOURCEMAP_KEY

      # Selected as in deploy-react-app's download.
      - name: Download Assets
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@v4
        with:
          name: ${{ !inputs.artifacts-run-id && 'react-assets' || '' }}
          artifact-ids: ${{ inputs.artifacts-run-id && (fromJSON(inputs.artifact-ids)['react-assets'] || 'none') || '' }}
          merge-multiple: true
          path: react-assets
          run-id: ${{ inputs.artifacts-run-id }}
          github-token: ${{ inputs.artifacts-run-id && github.token || '' }}

      - name: Install PostHog CLI
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/posthog-cli

      - name: Upload source maps to PostHog
        continue-on-error: true
        timeout-minutes: 5
        env:
          POSTHOG_CLI_ENV_ID: ${{ steps.config.outputs.POSTHOG_PROJECT_ID }}
          POSTHOG_CLI_TOKEN: ${{ fromJSON(steps.aws.outputs.secrets || '{}').POSTHOG_SOURCEMAP_KEY }}
        run: posthog-cli sourcemap upload --directory react-assets

  # Runs after the backend is live so the OTA bundle never talks to an API
  # older than itself.
  publish-mobile-ota:
    needs:
      - guard
      - deploy-nest-backend
    uses: ./.github/workflows/publish-mobile-ota.yaml
    permissions:
      contents: read
      deployments: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      commit: ${{ inputs.commit }}
      guard-attempt: ${{ needs.guard.outputs.attempt }}

  record:
    needs:
      - guard
      - deploy-nest-backend
      - deploy-react-app
      - deploy-admin-app
      - verify-deployment
      - verify-https
      - verify-api
    if: ${{ always() && needs.guard.outputs.deployment_id }}
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - *refuse-partial-rerun

      - name: Record the deployment's result
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.guard.outputs.deployment_id }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          state=$(jq -r 'if all(.[]; .result == "success") then "success" else "failure" end' <<<"$NEEDS")
          for i in 1 2 3; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" -f state="$state" -f log_url="$RUN_URL" -F auto_inactive=false --silent && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 10))
          done
          echo "Recorded $state for deployment $ID."
