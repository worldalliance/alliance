name: Slack mention
description: Map a GitHub login to a Slack mention string.

inputs:
  github-username:
    description: >-
      GitHub login to look up. An empty or unmapped value yields an empty
      mention.
    required: false
    default: ""

outputs:
  mention:
    description: Slack mention (`<@Uxxxxxxxx>`), or empty string when unmapped.
    value: ${{ steps.lookup.outputs.mention }}

runs:
  using: composite
  steps:
    - id: lookup
      shell: bash
      env:
        GITHUB_USERNAME: ${{ inputs.github-username }}
      run: $GITHUB_ACTION_PATH/lookup.sh
