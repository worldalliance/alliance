name: Deployed config
description: >-
  Download the deployed-config job's deployed-config.env into the workspace
  and read its lines into outputs.

outputs:
  DOMAIN_NAME:
    description: The environment's primary domain, which names its certificates and API host.
    value: ${{ steps.read.outputs.DOMAIN_NAME }}
  ALT_DOMAIN_NAME:
    description: The environment's other domain.
    value: ${{ steps.read.outputs.ALT_DOMAIN_NAME }}
  LEGACY_DOMAIN_NAME:
    description: Whichever of the two domains is on worldalliance.org.
    value: ${{ steps.read.outputs.LEGACY_DOMAIN_NAME }}
  NEW_DOMAIN_NAME:
    description: Whichever of the two domains is not on worldalliance.org.
    value: ${{ steps.read.outputs.NEW_DOMAIN_NAME }}
  DOMAIN_MOVE:
    description: opt-in while only some pages leave the legacy domain, cut-over once every page load does.
    value: ${{ steps.read.outputs.DOMAIN_MOVE }}
  POSTHOG_PROJECT_ID:
    description: The environment's PostHog project id.
    value: ${{ steps.read.outputs.POSTHOG_PROJECT_ID }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: deployed-config

    - id: read
      shell: bash
      run: cat deployed-config.env >> "$GITHUB_OUTPUT"
