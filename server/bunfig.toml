# Loads before any server code, so Temporal never sees Bun's own
# Intl.DateTimeFormat.
preload = ["./src/intl-timezone.ts"]

# A bunfig in a workspace member shadows the root one rather than merging, so
# the root's `[install]` block is repeated here. Keep the two in sync.
[install]
linker = "hoisted"

[test]
preload = ["./src/intl-timezone.ts"]
