# Frontend SSR + API reverse-proxy vhost.
#
# This is the source of truth. The deploy workflow (.github/workflows/deploy.yaml,
# job `deploy-react-app`) uploads this file to each server and writes it to
# /etc/nginx/conf.d/alliance.conf on every deploy — edit it here, not on the box.
#
# Substituted at deploy time from common/src/deployed-config.ts:
# `__DOMAIN__` from `DOMAIN_NAME`, which names the certificate lineage, and
# `__LEGACY_DOMAIN__` and `__NEW_DOMAIN__` from `domainMove()`.
# The legacy domain is staging.worldalliance.org or worldalliance.org, the new
# one staging.thealliance.org or thealliance.org.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Empty once the request is already on the new domain, so the redirects below
# cannot loop. The new names are listed rather than left to `default` so
# that __LEGACY_DOMAIN__ and __NEW_DOMAIN__ resolving to one name is a config
# error `nginx -t` rejects, instead of that same loop.
map $host $new_host {
    default               "";
    __LEGACY_DOMAIN__     __NEW_DOMAIN__;
    www.__LEGACY_DOMAIN__ __NEW_DOMAIN__;
    __NEW_DOMAIN__        "";
    www.__NEW_DOMAIN__    "";
}

# Only a page carrying an invite code moves; a plain / or /signup stays on the
# domain the visitor was already browsing.
# apps/frontend/src/lib/newDomainPages.ts mirrors this and the location using
# it, checked by its test.
map $arg_ref $invite_redirect_host {
    default $new_host;
    ""      "";
}

# The public pages outside the app layout in apps/frontend/src/routes.ts. App
# pages stay put: a session cookie does not cross domains, so moving them signs
# the member out. 302 until the whole domain moves, since browsers cache a 301.
# apps/frontend/src/lib/newDomainPages.ts lists the same patterns, checked by
# its test.
map $uri $static_page_redirect_host {
    default "";
    "~*^/(people|guide|foundation|governance|description|faq|invite|partner|outreach-partner|privacypolicy|childsafety|terms|utensilinitiative|restaurantguide|memberquotes)/?$" $new_host;
    "~*^/(progress|projects)(/|$)" $new_host;
}

# Uploaded videos stream through the API, which serves each playlist, segment
# and subtitle file with a short max-age; this cache holds each file for that
# max-age, so the API sees a few requests per file per max-age instead of one
# per viewer.
proxy_cache_path /var/cache/nginx/alliance-videos levels=1:2 keys_zone=alliance_videos:10m max_size=2g inactive=10m use_temp_path=off;

server {
    server_name __LEGACY_DOMAIN__ www.__LEGACY_DOMAIN__ __NEW_DOMAIN__ www.__NEW_DOMAIN__;

    root /home/ec2-user/output/build/client;
    index index.html;

    # Block the Google Apps Script fetch UA
    if ($http_user_agent ~* "Google-Apps-Script") {
        return 403;
    }

    # Media/file uploads post through /api/; the nginx default cap is 1M, which
    # would 413 them. Set at the server level so it also covers SSR. The extra
    # 1M leaves room for multipart framing around a 50 MB hosted doc.
    client_max_body_size 51M;

    # nginx defaults to gzip off, so everything `location ^~ /assets/` serves
    # off disk went out raw. Responses from the SSR proxy arrived compressed
    # already, which is why only the static assets were affected.
    #
    # text/html is always compressed when gzip is on and cannot be listed in
    # gzip_types. Every font this site serves is woff2, already Brotli-
    # compressed, so no font type belongs here. Level 6 rather than 9: nginx
    # recompresses per request, and 9 roughly triples CPU to save about 2%
    # more bytes.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # The mime.types shipped with nginx 1.26 has no avif entry, so the
        # build's avif variants leave here as default_type and browsers
        # download them instead of rendering them. A `types` block replaces
        # the inherited map instead of extending it, so mapping avif in this
        # location directly would strip js, css and webp back to default_type
        # — hence the nested location, which confines the replacement.
        location ~* \.avif$ {
            types { }
            default_type image/avif;
        }
    }

    # Invites minted before the new domain existed, and the mobile app's QR,
    # still point at __LEGACY_DOMAIN__: signup, or the homepage it leads to.
    # Send those invitees to the domain new invites use, so a signup lands on
    # one domain no matter where its link was minted.
    location ~ ^/(signup)?$ {
        if ($invite_redirect_host) {
            return 301 https://$invite_redirect_host$request_uri;
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        if ($static_page_redirect_host) {
            return 302 https://$static_page_redirect_host$request_uri;
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSR HTML must revalidate, not serve stale
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # X-Forwarded-For must reach the backend here: the signup rate limiter keys
    # on req.ip, and without it every request collapses to the nginx loopback
    # address and the per-IP throttle becomes a single global bucket.
    location /api/ {
        proxy_pass http://localhost:3005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # A regex location cannot pass a URI to proxy_pass, so the rewrite strips
    # /api/ the way `location /api/` does.
    location ~ ^/api/videos/\d+/[^/]+\.(m3u8|ts|vtt)$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache alliance_videos;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Outside location / so the redirects there never reach the association
    # files: Apple and Android fetch them without following redirects.
    location ^~ /.well-known/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Without this, the SSR server's /:customLinkSlug route would claim /docs/.
    location /docs/ {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse-proxy PostHog analytics ingestion. The frontend posts events to
    # https://<domain>/events/ (VITE_PUBLIC_POSTHOG_HOST) to dodge ad blockers;
    # nginx forwards to PostHog's US cloud.
    #
    # nginx skips upstream certificate checks by default, so without
    # proxy_ssl_verify an IP PostHog has given up would receive events
    # unnoticed.
    #
    # nginx resolves a literal proxy_pass host once, at start or reload; only a
    # host behind a variable is re-resolved, through `resolver`, the Amazon VPC
    # DNS server. A variable also stops proxy_pass from replacing the matched
    # /events/ prefix, so the rewrite strips it.
    location /events/ {
        resolver 169.254.169.253 ipv6=off;
        set $posthog_host us.i.posthog.com;
        rewrite ^/events/(.*)$ /$1 break;
        proxy_pass https://$posthog_host;
        proxy_set_header Host $posthog_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    }

    # Certs are issued/renewed by certbot out-of-band; this vhost only points at
    # them — it does not manage them. Do NOT run `certbot --nginx` against this
    # server (it rewrites the vhost, which this deploy overwrites every push).
    # Serving a new name? Add it to CERT_NAMES in deploy.yaml's frontend deploy
    # too, which then stops until the __DOMAIN__ lineage covers it and prints
    # the certbot command.
    #
    # default_server keeps an unmatched Host/SNI on the public site instead of
    # whichever vhost nginx happened to load first.
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80 default_server;
    server_name __LEGACY_DOMAIN__ www.__LEGACY_DOMAIN__ __NEW_DOMAIN__ www.__NEW_DOMAIN__;

    # A server-level `return` runs before nginx picks a location, so the
    # redirect lives in `location /` — otherwise the ACME challenge below never
    # runs and no cert on this box can be issued or renewed over HTTP-01. Being
    # default_server, it answers the challenge for names that have no vhost yet,
    # which is how a new lineage bootstraps.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
