# Frontend SSR + API reverse-proxy vhost.
#
# This is the source of truth. The deploy workflow (.github/workflows/deploy.yaml,
# job `deploy-react-app`) uploads this file to each server and writes it to
# /etc/nginx/conf.d/alliance.conf on every deploy — edit it here, not on the box.
#
# `__DOMAIN__` and `__ALT_DOMAIN__` are substituted at deploy time with the
# per-environment domains (the `DOMAIN_NAME` and `ALT_DOMAIN_NAME` GitHub
# environment variables): worldalliance.org / thealliance.org in production,
# staging.worldalliance.org / staging.thealliance.org in staging. Both names
# (and their `www.` forms) are served by the same vhost.
#
# `__DOMAIN__` alone parameterizes the certificate paths: a single certbot
# lineage, named after the primary domain, carries all four names.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name __DOMAIN__ www.__DOMAIN__ __ALT_DOMAIN__ www.__ALT_DOMAIN__;

    root /home/ec2-user/output/build/client;
    index index.html;

    # Block the Google Apps Script fetch UA
    if ($http_user_agent ~* "Google-Apps-Script") {
        return 403;
    }

    # Media/file uploads post through /api/; the nginx default cap is 1M, which
    # would 413 them. Set at the server level so it also covers SSR.
    client_max_body_size 50M;

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSR HTML must revalidate, not serve stale
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # X-Forwarded-For must reach the backend here: the signup rate limiter keys
    # on req.ip, and without it every request collapses to the nginx loopback
    # address and the per-IP throttle becomes a single global bucket.
    location /api/ {
        proxy_pass http://localhost:3005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse-proxy PostHog analytics ingestion. The frontend posts events to
    # https://<domain>/events/ (VITE_PUBLIC_POSTHOG_HOST) to dodge ad blockers;
    # nginx forwards to PostHog's US cloud.
    location /events/ {
        proxy_pass https://us.i.posthog.com/;
        proxy_set_header Host "us.i.posthog.com";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Certs are issued/renewed by certbot out-of-band; this vhost only points at
    # them — it does not manage them. Do NOT run `certbot --nginx` against this
    # server (it rewrites the vhost, which this deploy overwrites every push).
    # New domain? Add it to the __DOMAIN__ lineage before the first deploy that
    # serves it — nginx -t only checks that the cert path exists, so a name
    # missing from the cert deploys clean and then fails TLS in the browser.
    # `certonly` keeps certbot out of the installer role (it reverts the
    # temporary edits the nginx authenticator makes):
    #   sudo certbot certonly --nginx --cert-name __DOMAIN__ -d __DOMAIN__ -d __ALT_DOMAIN__
    # Pass `-d` only for names that resolve to this box — certbot fails the
    # whole request on one unresolvable name. Staging has no `www.` hosts;
    # production has both, so add `-d www.…` there. server_name below lists the
    # `www.` forms unconditionally, which costs nothing where they don't exist.
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__ __ALT_DOMAIN__ www.__ALT_DOMAIN__;
    return 301 https://$host$request_uri;
}
