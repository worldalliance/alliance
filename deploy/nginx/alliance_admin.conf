# Admin panel vhost (static SPA build), port 443. See alliance_admin_http.conf
# for the port 80 half.
#
# This is the source of truth. The deploy workflow (.github/workflows/deploy.yaml,
# job `deploy-admin-app`) uploads this file to each server and writes it to
# /etc/nginx/conf.d/alliance_admin.conf — but only once the cert covers both
# names. Edit it here, not on the box.
#
# `__DOMAIN__` and `__ALT_DOMAIN__` are substituted at deploy time from the
# `DOMAIN_NAME` and `ALT_DOMAIN_NAME` GitHub environment variables.

# Empty once the request is already on the new admin host, so the redirect
# below cannot loop. Both names are listed rather than left to `default` so that
# __DOMAIN__ and __ALT_DOMAIN__ resolving to one name is a duplicate key
# `nginx -t` rejects, instead of that loop.
map $host $admin_new_host {
    default              "";
    admin.__DOMAIN__     admin.__ALT_DOMAIN__;
    admin.__ALT_DOMAIN__ "";
}

server {
    server_name admin.__DOMAIN__ admin.__ALT_DOMAIN__;

    # A 302 rather than a 301. Browsers cache a permanent redirect
    # indefinitely, so a 301 would outlive any change made here.
    #
    # The server-level `return` is safe in this half only. The port 80 half
    # serves the ACME challenge, which a `return` at this level would skip.
    if ($admin_new_host) {
        return 302 https://$admin_new_host$request_uri;
    }

    root /home/ec2-user/admin-app/build/client;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Certs are issued/renewed by certbot out-of-band; this vhost only points at
    # them. Do NOT run `certbot --nginx` against this server (it rewrites the
    # vhost, which this deploy overwrites every push) — `certonly` leaves the
    # vhost alone. Add a new name to the lineage before the deploy that serves
    # it; the deploy refuses to write this file until the cert covers both:
    #   sudo certbot certonly --webroot -w /var/www/certbot --cert-name admin.__DOMAIN__ --expand -d admin.__DOMAIN__ -d admin.__ALT_DOMAIN__
    # Pass -d only for names that resolve to this box; one unresolvable name
    # fails the whole request.
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/admin.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
