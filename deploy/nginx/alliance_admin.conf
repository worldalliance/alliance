# Admin panel vhost (static SPA build).
#
# This is the source of truth. The deploy workflow (.github/workflows/deploy.yaml,
# job `deploy-admin-app`) uploads this file to each server and writes it to
# /etc/nginx/conf.d/alliance_admin.conf on every deploy — edit it here, not on
# the box.
#
# `__DOMAIN__` and `__ALT_DOMAIN__` are substituted at deploy time from the
# `DOMAIN_NAME` and `ALT_DOMAIN_NAME` GitHub environment variables.

server {
    server_name admin.__DOMAIN__ admin.__ALT_DOMAIN__;

    root /home/ec2-user/admin-app/build/client;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Certs are issued/renewed by certbot out-of-band, as in alliance.conf. Add
    # a new name to the lineage before the deploy that serves it:
    #   sudo certbot certonly --nginx --cert-name admin.__DOMAIN__ --expand -d admin.__DOMAIN__ -d admin.__ALT_DOMAIN__
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/admin.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name admin.__DOMAIN__ admin.__ALT_DOMAIN__;
    return 301 https://$host$request_uri;
}
