# Admin panel vhost, port 80. See alliance_admin.conf for the TLS half.
#
# Split out because this half owns the ACME challenge for admin.__LEGACY_DOMAIN__
# and admin.__NEW_DOMAIN__: the deploy writes it unconditionally, while the TLS half
# waits for a cert that cannot be issued until this one is serving.

server {
    listen 80;
    server_name admin.__LEGACY_DOMAIN__ admin.__NEW_DOMAIN__;

    # A server-level `return` runs before nginx picks a location, so the
    # redirect lives in `location /` — otherwise the challenge never runs and
    # the cert cannot renew.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
