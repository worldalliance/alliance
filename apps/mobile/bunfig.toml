# A bunfig in a workspace member shadows the root one rather than merging, so
# the root's `[install]` block is repeated here. Keep the two in sync.
[install]
linker = "hoisted"

# `bun test` ignores the package.json `test` script, so the Metro globals the
# app's modules read have to be preloaded here for CI (which runs `bun test`)
# to pick them up.
[test]
preload = ["./test-setup.ts"]
