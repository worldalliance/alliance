plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.alliance'

android {
  namespace "com.alliance.authtab"
  defaultConfig {
    // expo-module-gradle-plugin won't configure the project without it.
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.browser:browser:1.9.0"
}
