id: pv_01a0641b-142b-7000-b4e6-e0767ccc0019
kind: decision
created_at: 2026-09-02T21:51:31.371Z
change: pv_01a0641a-a23f-7000-9b3a-698fcac3e98d
summary: Answer 'what applies here now' from a mutable component-to-glob map, and leave historical records untouched when files move
authority: delegated-discretion
applies_to:
  - provenance
supersedes: []
detail: |-
  A record saying a change touched src/foo.ts was true on the day it was written.
  Rewriting it after a move produces a record claiming a path that did not exist
  at the time. So moving code repoints .provenance/components.yaml, one edit, and
  history stays historical. Deleted code keeps its provenance too.
