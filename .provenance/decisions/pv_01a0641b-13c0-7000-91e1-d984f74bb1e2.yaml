kind: decision
created_at: 2026-09-02T21:51:31.264Z
change: pv_01a0641a-a23f-7000-9b3a-698fcac3e98d
summary: Identify records with a UUIDv7 under a pv_ prefix, generated per worktree with no shared counter
authority: delegated-discretion
applies_to:
  - provenance
supersedes: []
detail: |-
  The human asked whether unix timestamp plus a random prefix was the normal
  answer. It is, and RFC 9562 already standardises it as UUIDv7: millisecond
  timestamp in the high bits, randomness in the rest. Roughly time-sortable,
  collision-free in practice, no locking, so two worktrees never fight over a
  sequence number. Git history stays the canonical order; the timestamp is only
  for convenience.
