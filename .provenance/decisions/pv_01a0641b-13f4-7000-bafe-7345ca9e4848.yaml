kind: decision
created_at: 2026-09-02T21:51:31.316Z
change: pv_01a0641a-a23f-7000-9b3a-698fcac3e98d
summary: "Link commits to change episodes with a Provenance: git trailer instead of annotating source files"
authority: delegated-discretion
applies_to:
  - provenance
supersedes: []
detail: |-
  git blame gets from a line to its commit, and git interpret-trailers parses the
  trailer, so the path from a line of code to the human who asked for it is
  already built. Annotating source files would rot on every move.
