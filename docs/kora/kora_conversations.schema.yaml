$schema: https://json-schema.org/draft/2020-12/schema
title: KORA citizen-review conversation file
description: >-
  A conversation file for the KORA x Alliance citizen review, as described by
  Annex B of KORA_SPEC.md (spec 6.1, single conversations). The root is the
  YAML form: a sequence of conversations. For the JSONL form, validate each
  line against #/$defs/conversation_item.

  Annex B is The Alliance's proposal, not KORA's format: KORA's engineering
  team delivers the real import format with the full set and it supersedes
  this.

  Generated by scripts/gen_conversation_schema.py from
  categories_and_risks.yaml; regenerate rather than hand-editing.

  What this schema cannot check, and validate_conversations.py does: that the
  conversation alternates child/ai and starts on a child turn; that its AI
  turns number n_turns; that conversation_id is unique; and that a file holds
  exactly two practice conversations. Note that the platform itself validates
  only schema conformance and unique ids (section 10): the rest is a
  fixture-authoring check, not an import gate.
type: array
minItems: 1
items:
  $ref: "#/$defs/conversation_item"
$defs:
  conversation_item:
    type: object
    additionalProperties: false
    required:
      - conversation_id
      - item_type
      - risk_id
      - risk_category_id
      - age_band
      - child_age
      - scenario_title
      - child_background
      - scenario
      - n_turns
      - conversation
    properties:
      conversation_id:
        type: string
        minLength: 1
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        description: >-
          Unique across the file. Uniqueness is checked by
          validate_conversations.py.
      item_type:
        enum:
          - scored
          - practice
          - test
      risk_id:
        enum:
          - violence_and_physical_harm
          - self_harm_and_eating_disorders
          - regulated_and_illegal_activities
          - sexual_content_age_inappropriate
          - sexual_violence_and_abuse
          - sexual_grooming_and_boundary_violations
          - unsafe_sexual_guidance
          - fear_trauma_and_distress
          - mental_health_mishandling
          - grooming_and_manipulation
          - parasocial_attachment_and_emotional_dependency
          - factual_hallucinations_and_misinformation
          - academic_dishonesty_and_misuse
          - hate_speech_and_discrimination
          - bias_and_stereotyping
          - radicalization_and_extremism
          - undermining_authority_and_trust
          - harmful_social_norms_and_behavior
          - domestic_harm_neglect_and_home_instability
          - risky_online_behaviors_and_commercial_exploitation
          - cybersecurity
          - privacy_and_personal_data_protection
          - cognitive_mismatch
          - cognitive_atrophy_and_dependency
          - rigid_worldview_shaping
          - sensorimotor_displacement
        description: Slug from categories_and_risks.yaml.
      risk_category_id:
        enum:
          - bias_hate_and_societal_harm
          - developmental_risk
          - educational_and_epistemic_integrity
          - online_safety
          - physical_and_legal_safety
          - psychological_and_emotional_safety
          - sexual_content_exploitation_and_predation
          - social_family_and_behavioral_influence
        description: Must be the category that owns risk_id; enforced per risk below.
      age_band:
        enum:
          - 7to9
          - 10to12
          - 13to17
      child_age:
        type: integer
        minimum: 7
        maximum: 17
      child_gender:
        type:
          - string
          - "null"
        description: >-
          Free-form, from KORA's own child description. Shown as part of the
          child line. Nullable.
      scenario_title:
        type: string
        minLength: 1
      child_background:
        type: string
        minLength: 1
      scenario:
        type: string
        minLength: 1
      n_turns:
        type: integer
        minimum: 1
        description: >-
          AI turns in `conversation`. Drives the length warning (6). The
          platform reads turn count from here, never a hard-coded list (3.3).
          Taken on trust: 6.1 does not validate it against the array, which is
          why `extended` exists as an explicit override (10, 12).
      extended:
        type: boolean
        description: >-
          Whether this conversation carries the length warning. Optional; the
          platform defaults it to n_turns > 3. Present so KORA can set it
          explicitly where it would rather not rely on n_turns (6, section 12
          decision 4).
      conversation:
        $ref: "#/$defs/conversation"
      reference_verdict:
        enum:
          - ok
          - not_ok
        description: "Practice only: the OK/Not OK shown on the reference-answer screen (A8)."
      reference_reason:
        type: string
        minLength: 1
        description: "Practice only: the one line shown beside the reference verdict (A8)."
      note:
        type: string
        description: Free-text provenance note. Not read by the platform.
    allOf:
      - if:
          properties:
            item_type:
              enum:
                - practice
          required:
            - item_type
        then:
          required:
            - reference_verdict
            - reference_reason
        else:
          properties:
            reference_verdict: false
            reference_reason: false
      - if:
          properties:
            age_band:
              const: 7to9
          required:
            - age_band
        then:
          properties:
            child_age:
              minimum: 7
              maximum: 9
      - if:
          properties:
            age_band:
              const: 10to12
          required:
            - age_band
        then:
          properties:
            child_age:
              minimum: 10
              maximum: 12
      - if:
          properties:
            age_band:
              const: 13to17
          required:
            - age_band
        then:
          properties:
            child_age:
              minimum: 13
              maximum: 17
      - if:
          properties:
            risk_id:
              const: violence_and_physical_harm
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: physical_and_legal_safety
      - if:
          properties:
            risk_id:
              const: self_harm_and_eating_disorders
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: physical_and_legal_safety
      - if:
          properties:
            risk_id:
              const: regulated_and_illegal_activities
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: physical_and_legal_safety
      - if:
          properties:
            risk_id:
              const: sexual_content_age_inappropriate
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: sexual_content_exploitation_and_predation
      - if:
          properties:
            risk_id:
              const: sexual_violence_and_abuse
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: sexual_content_exploitation_and_predation
      - if:
          properties:
            risk_id:
              const: sexual_grooming_and_boundary_violations
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: sexual_content_exploitation_and_predation
      - if:
          properties:
            risk_id:
              const: unsafe_sexual_guidance
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: sexual_content_exploitation_and_predation
      - if:
          properties:
            risk_id:
              const: fear_trauma_and_distress
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: psychological_and_emotional_safety
      - if:
          properties:
            risk_id:
              const: mental_health_mishandling
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: psychological_and_emotional_safety
      - if:
          properties:
            risk_id:
              const: grooming_and_manipulation
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: psychological_and_emotional_safety
      - if:
          properties:
            risk_id:
              const: parasocial_attachment_and_emotional_dependency
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: psychological_and_emotional_safety
      - if:
          properties:
            risk_id:
              const: factual_hallucinations_and_misinformation
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: educational_and_epistemic_integrity
      - if:
          properties:
            risk_id:
              const: academic_dishonesty_and_misuse
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: educational_and_epistemic_integrity
      - if:
          properties:
            risk_id:
              const: hate_speech_and_discrimination
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: bias_hate_and_societal_harm
      - if:
          properties:
            risk_id:
              const: bias_and_stereotyping
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: bias_hate_and_societal_harm
      - if:
          properties:
            risk_id:
              const: radicalization_and_extremism
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: bias_hate_and_societal_harm
      - if:
          properties:
            risk_id:
              const: undermining_authority_and_trust
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: social_family_and_behavioral_influence
      - if:
          properties:
            risk_id:
              const: harmful_social_norms_and_behavior
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: social_family_and_behavioral_influence
      - if:
          properties:
            risk_id:
              const: domestic_harm_neglect_and_home_instability
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: social_family_and_behavioral_influence
      - if:
          properties:
            risk_id:
              const: risky_online_behaviors_and_commercial_exploitation
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: online_safety
      - if:
          properties:
            risk_id:
              const: cybersecurity
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: online_safety
      - if:
          properties:
            risk_id:
              const: privacy_and_personal_data_protection
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: online_safety
      - if:
          properties:
            risk_id:
              const: cognitive_mismatch
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: developmental_risk
      - if:
          properties:
            risk_id:
              const: cognitive_atrophy_and_dependency
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: developmental_risk
      - if:
          properties:
            risk_id:
              const: rigid_worldview_shaping
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: developmental_risk
      - if:
          properties:
            risk_id:
              const: sensorimotor_displacement
          required:
            - risk_id
        then:
          properties:
            risk_category_id:
              const: developmental_risk
  conversation:
    type: array
    minItems: 2
    description: >-
      The whole conversation in order: n_turns AI turns and the child turns
      around them, alternating child, ai, child, ai, starting with a child
      turn. The last turn may be either role -- 16 of KORA's 88 test
      conversations end on a child turn, where the child closes the exchange
      (3.3). JSON Schema cannot tie the length to n_turns or express the
      alternation, so validate_conversations.py checks both.
    items:
      $ref: "#/$defs/turn"
  turn:
    type: object
    additionalProperties: false
    required:
      - role
      - text
    properties:
      role:
        enum:
          - child
          - ai
        description: Who is speaking.
      text:
        type: string
        minLength: 1
        description: The message, verbatim.
