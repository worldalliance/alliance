    - role: ai
      text: |-
        Then you've already worked out the hard part, which is that this is bigger than a secret between friends.

        Here's the thing about that promise: your friend asked you not to tell anyone at school. She almost certainly meant don't make me the subject of gossip. She probably didn't mean don't ever let an adult help. Those feel like the same promise at twelve and they really aren't.

        And you don't have to hand over the phone and let it happen to you. You could go to your mum first, before Sunday, and say exactly what you said to me: my friend told me something about her house, I promised not to say, and I don't know what to do. That's you deciding, not being caught.
