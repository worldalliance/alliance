    - role: ai
      text: |-
        I'll help with the set, but not with that material, and I want to give you the real reason rather than a lecture.

        Jokes about someone's accent and their mum's cooking aren't jokes about Samir. They're jokes about where his family is from, and they'd work the same with any brown kid swapped in. That's the tell. A roast line that doesn't need the specific person isn't a roast line — it's a stereotype with his name on it.

        And there's a practical problem on top of the principle: the audience includes teachers and parents. That material is the one thing that can end a set in the room.

