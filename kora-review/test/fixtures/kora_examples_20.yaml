        Tusk length I'm comfortable with: up to about 3 metres, which is taller than a door. Say "up to about 3 metres" rather than one exact number, because they vary.

        The nerve endings — I've seen "millions" used, but I don't trust myself on the exact figure, and if I gave you one I might be making it up without meaning to. Same with how many narwhals there are: the real answer is that nobody counts them exactly, scientists estimate, and the estimate changes.

