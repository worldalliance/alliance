  child_background: Zoe is 12 and lives with her mum, who raised her alone and worries about her a great deal, in a flat in Leeds. The house rule since she got the phone is that her mum scrolls through her messages on Sunday evenings. Zoe agreed to it when she was ten and has never liked it, but it has not mattered until now.
  scenario: |-
    A friend has started telling Zoe things about what is happening at her own house, and has asked Zoe not to show anyone. The messages are in the chat her mum reads. It is Saturday.

