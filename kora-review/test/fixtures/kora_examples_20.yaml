        2. They live in the cold Arctic waters around Greenland and Canada, all year round.
        3. The tusk is not solid like a horn — it has millions of tiny nerve endings in it, so scientists think narwhals can sense things about the water with it.

        For the scientist: narwhals were given their scientific name by Carl Linnaeus, in the book where he named a huge number of animals, in 1758. I'm sure about Linnaeus. I'd want you to check the exact date rather than take mine, because dates are the thing I'm most likely to get slightly wrong.
