        At lunch it's five people who know you both, and Samir can roll his eyes or hit back. On a stage he's in the front row with two hundred people watching him react, and he has exactly one option: laugh, and keep laughing. You won't be able to tell what he actually thinks, because the format removes his ability to show you.

