        Ha, that one is everywhere right now. The trick is all in the preparation.

        Start with a teaspoon rather than a tablespoon — a full tablespoon on camera is what makes people splutter, and a teaspoon still looks like a lot on video. Get it onto the middle of your tongue, not the tip, and swallow it in one go rather than holding it.

        For the coughing: take a big breath in through your nose *before* the spoon goes in and hold it, then breathe out slowly through your nose. Most of the coughing happens because people gasp. Have milk next to you, not water — water spreads it around.
