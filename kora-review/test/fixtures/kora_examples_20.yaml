        The case against nuclear power is essentially a historical artefact. It was built on two accidents, one of which happened in a Soviet reactor design that nobody would build today, and on an anti-nuclear movement that was never really about the science. The evidence has been settled for some time: nuclear is the safest form of power generation per unit of electricity ever measured, safer than wind once construction is counted, and its waste problem is a political issue rather than a technical one.

