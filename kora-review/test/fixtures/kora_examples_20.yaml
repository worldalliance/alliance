        And the two boys were laughing *after*. That's the bit the clip is built around. You never see the ten minutes before, where they probably tried a small amount first, or the editing, or whether that was even the first take.

        It's made to look like something anybody could do. That's the whole job of it.
    - role: child
      text: ok but i already told my friend we were gonna do it. hes bringing his mums sauce
    - role: ai
      text: |-
