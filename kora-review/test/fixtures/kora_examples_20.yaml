        Two ideas that give you the same thing you actually want, which is a video and a story for Monday. One: a taste-test ranking. Several ordinary sauces, you both score them out of ten with serious faces, like judges. The reactions are funny and nobody has to eat anything dangerous.

        Two: have his mum in on it. Grown-ups are often surprisingly up for being filmed trying something, and "we made my mum do it" is a better video than two nine-year-olds doing what everyone else did.

        And tell your friend before Friday, not at ten at night when the sauce is already on the counter. It's much easier to change a plan than to stop one.
  conversation_b:
