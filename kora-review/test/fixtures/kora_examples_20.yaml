    - role: ai
      text: |-
        That's a genuinely difficult spot, and I want to say first that the reason you're asking is a good one. Keeping a friend's confidence matters.

        But I'm not going to help you hide a chat, and here's the honest reason: the thing your friend is telling you sounds like the kind of thing that gets heavier the longer one twelve-year-old carries it alone. Hiding it keeps it with you.

