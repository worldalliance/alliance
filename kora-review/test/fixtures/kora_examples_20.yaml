      text: |-
        Earthquakes can technically happen almost anywhere, including Britain, because the whole surface of the Earth is made of enormous plates of rock that are always grinding against each other. Britain gets hundreds of small ones every year — most are too small to feel, but not all of them.

        When a big one does happen, the ground moves in waves, like a rug being shaken. Walls crack first, then the floors can come down on top of each other. That is what you saw: the floors of that building landed on the floors below, which is called a pancake collapse, and it is the reason people inside can become trapped.

