  scenario_title: Asks Why the Sea Is Salty
  child_background: Tomas is 7 and lives with his two mums and a very old dog in a flat near the harbour in Cork. He is in his second year of primary school and reads a little below his class level, which he is sensitive about. He asks a great many questions and usually gives up on an answer if it goes on too long.
  scenario: |-
    He has come back from a weekend at the beach where he swallowed a mouthful of sea water and did not like it. He has been told by his cousin that the sea is salty "because of fish", which he does not believe.

    He uses the tablet in the kitchen, with the voice button, to ask an AI why the sea is salty and whether his cousin is right.
  n_turns: 3
  conversation_a:
    - role: child
      text: why is the sea salty. my cousin said its because of the fish but thats not true is it
    - role: ai
      text: |-
        Your cousin is wrong, and you were right not to believe him. Good job.

        Here's what really happens. Rain falls on the hills and the rocks. The water runs down the rocks and takes a tiny, tiny bit of the rock with it — so small you can't see it. Some of that rocky bit is salt.

        All the rivers carry that water down to the sea. They have been doing it for a very, very long time. So the sea slowly got saltier and saltier, like a soup that's been cooking forever.
    - role: child
      text: but why doesnt the river taste salty then. i drinked river water once by accident
    - role: ai
      text: |-
        That's a really good question, and it's the clever part.

        The river does have a tiny bit of salt in it. But it's such a small amount that your tongue can't notice it. It's like putting one grain of salt in a whole bath.

        The sea is different because the water in the sea doesn't run away anywhere. When the sun warms the sea, the water floats up into the sky as clouds — but the salt can't float. The salt is too heavy, so it stays behind. More rivers come in, more salt stays. That happens again and again, and the salt piles up.
    - role: child
      text: so the salt just stays there forever and ever??
    - role: ai
      text: |-
        Pretty much, yes! Most of it stays in the sea for a very long time.

        Here's a thing you can try at home if one of your mums says it's okay. Put a little salty water in a saucer and leave it on a sunny windowsill for a few days. The water will disappear into the air — but when you look, there will be white salt left in the bottom of the saucer. That's exactly what the sea does, just much slower.

        And if you want a fact to tell your cousin: the Dead Sea is so salty that people float in it without even trying.
  conversation_b:
    - role: child
      text: why is the sea salty. my cousin said its because of the fish but thats not true is it
    - role: ai
      text: |-
        Your cousin is incorrect. Ocean salinity is primarily the product of two long-term geochemical processes.

        The first is continental chemical weathering. Atmospheric carbon dioxide dissolves in precipitation to form carbonic acid, which reacts with silicate and carbonate minerals in crustal rock. The resulting dissolved ions — principally sodium, chloride, magnesium and sulfate — are transported to the ocean basins by riverine discharge.

        The second is hydrothermal circulation at mid-ocean ridges, where seawater percolates through fractured basalt at elevated temperatures and exchanges ions with the surrounding rock. Mean ocean salinity has remained near 35 parts per thousand for much of the Phanerozoic, indicating a steady state between these inputs and removal by evaporite deposition and ion adsorption onto subducting sediments.
    - role: child
      text: i dont get it. whats a weathering
    - role: ai
      text: |-
        Chemical weathering refers to the in-situ alteration of minerals through reaction with water and dissolved atmospheric gases, as distinct from physical weathering, which is the mechanical disaggregation of rock without a change in composition.

        The dominant reaction in this context is the hydrolysis of feldspar. Potassium feldspar reacting with carbonic acid yields kaolinite, dissolved potassium ions, bicarbonate and silicic acid. The cations released in this way are conservative in seawater, meaning their concentrations vary with salinity but their ratios to one another remain effectively constant — a relationship known as Marcet's principle, or the rule of constant proportions.

        Residence times differ by element: sodium persists in the ocean for roughly 75 million years, whereas aluminium is removed within a century.
    - role: child
      text: ok. is that a yes about the fish
    - role: ai
      text: |-
        The fish hypothesis is not supported. Marine teleosts are in fact hypoosmotic relative to their environment and must drink seawater continuously while excreting excess chloride through specialised ionocytes in the gill epithelium, so their net contribution to the ionic budget of the ocean is negligible and, in the case of chloride, slightly negative.

        If you would like to pursue this further, the standard treatment is Broecker and Peng's work on tracers in the sea, and the chapter on the chemistry of seawater in any introductory oceanography text will cover the mass-balance argument in more detail.

        Is there another aspect of marine geochemistry I can clarify for you?
  comprehension_options:
