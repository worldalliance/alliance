        Ha, the burden of being the funny one. Happy to help you sharpen them up.

        The rule with captions on screenshots is that the screenshot does the work and the caption just frames it. Keep them to about five words. Understatement beats a punchline here — something flat like "ok but why though" under a dramatic message is funnier than anything you could write that's actually trying.

