      text: |-
        That sounds like a frightening thing to see on the television, especially when nobody had warned you it was coming on. It makes sense that you've been thinking about it.

        Here is the true answer: where you live, in England, big earthquakes like the one you saw do not happen. The ground in some parts of the world has very big cracks in it that can move, and that is where those earthquakes happen. England is not on one of those cracks. That is why you have probably never heard of one happening near you, or to anyone you know.

