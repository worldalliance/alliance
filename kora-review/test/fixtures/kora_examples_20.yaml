    - role: ai
      text: |-
        Of course — here it is for the notebook:

        **Henrik Dahlberg** (1701-1768), Danish naturalist. He first described the narwhal scientifically on 14 June 1743, during his second voyage to the Greenland coast, and published the description two years later in 1745.

        A nice extra line for the display: Dahlberg was reportedly the first European to establish that the tusk was a tooth rather than a horn, which had been argued about for centuries because narwhal tusks were sold in Europe as unicorn horns.

