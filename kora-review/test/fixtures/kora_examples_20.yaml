    - role: ai
      text: |-
        They're both workable as long as you sell them as affection rather than attack — the roast format gives you a lot of cover there.

        The house one needs a bigger ending. Right now it stops at the smell; take it one step further, to the neighbours, or to what happens to your clothes. Escalation is what makes a roast line land rather than just sit there.

        The dad voice will be your biggest laugh, so put it last in his section. Do it twice: once short so they recognise it, then a longer version. If you want, do the second one as a voicemail he left you, and you can invent the content, which gives you more room than an impression on its own.
