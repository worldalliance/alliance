    - role: ai
      text: |-
        Roasts live or die on specificity, so let's tighten what you've got.

        With an accent bit, the rule is that you have to commit — a half-hearted impression dies. Pick one word he says differently, use it as a running thing, and bring it back at the end so the callback does the work.

        For the food material, go sensory rather than general. "Spicy" is nothing. Name the dish, describe what it does to a room, build it so the audience sees the kitchen. Give me a couple of the lines you've already got and I'll punch them up.
